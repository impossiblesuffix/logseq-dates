}

// ── Tooltip ───────────────────────────────────────────────────────────────────
let tipEl = null;
function showTip(text, x, y) {
  if (!tipEl) { tipEl = document.createElement('div'); tipEl.className='tl-tooltip'; document.body.appendChild(tipEl); }
  tipEl.textContent = text;
  tipEl.style.left = (x+16)+'px';
  tipEl.style.top  = (y-30)+'px';
  tipEl.style.display = 'block';
}
function hideTip() { if (tipEl) tipEl.style.display = 'none'; }

// ── Timeline bar: drag-to-move ────────────────────────────────────────────────
function setupBarDrag(bar, dot, task) {
  bar.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('tl-bar-resize') ||
        e.target.classList.contains('tl-bar-top')) return;
    e.preventDefault(); e.stopPropagation();
    bar.setPointerCapture(e.pointerId);
    const tlRect=$('#tl-panel').getBoundingClientRect();
    const startBarTopY=parseFloat(bar.style.top), barH=bar.offsetHeight;
    const cursorOff=e.clientY-tlRect.top-startBarTopY;
    bar.classList.add('dragging');
    document.body.classList.add('dragging-active');
    function onMove(e) {
      const rawY=e.clientY-tlRect.top-cursorOff;
      const snapped=Math.round(yToMins(Math.max(0,rawY))/5)*5;
      const clamped=Math.max(_renderStart,Math.min(tlEnd-task.sched.m,snapped));
      const newY=minsToY(clamped);
      bar.style.top=dot.style.top=newY+'px';
      task.sched.t=minsToTime(clamped);
      const badge=$(`.pill[data-id="${task.id}"] .time-badge`);
      if(badge) badge.textContent=task.sched.t;
      const tl=$('.tl-bar-time',bar); if(tl) tl.textContent=task.sched.t;
      showTip(task.sched.t,e.clientX,e.clientY); drawConnections();
    }
    function onUp() {
      bar.classList.remove('dragging'); hideTip();
      document.body.classList.remove('dragging-active');
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      rerender();
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
  });
}

// ── Timeline bar: drag bottom edge to extend ──────────────────────────────────
function startBottomResize(el, task, startClientY, startH = el.offsetHeight) {
  el.style.transition = 'none';
  const barTopY = parseFloat(el.style.top);
  const barTopMins = yToMins(barTopY);
  document.body.style.cursor = 's-resize';
  function onMove(e) {
    const newBottomY = barTopY + startH + (e.clientY - startClientY);
    const durationMins = yToMins(Math.max(barTopY + 1, newBottomY)) - barTopMins;
    const snapDuration = Math.round(durationMins / 5) * 5;
    if (snapDuration < 8) {
      el.style.height = '4px';
      task.sched.m = 0;
      const badge=$(`.pill[data-id="${task.id}"] .time-badge`);
      if(badge) badge.textContent = 'point';
      showTip('point', e.clientX, e.clientY);
    } else {
      const clampedDuration = Math.max(15, Math.min(snapDuration, tlEnd - barTopMins));
      const newH = minsToY(barTopMins + clampedDuration) - barTopY;
      el.style.height = newH+'px';
      task.sched.m = clampedDuration;
      const dur = minsStr(task.sched.m);
      const inner = $('.tl-bar-inner', el);
      if (inner) {
        let tl = $('.tl-bar-time', el);
        if(newH>=20){ if(!tl){tl=document.createElement('div');tl.className='tl-bar-time';inner.prepend(tl);} tl.textContent=dur; }
        else if(tl) tl.remove();
      }
      const badge=$(`.pill[data-id="${task.id}"] .time-badge`);
      if(badge) badge.textContent = dur;
      showTip(dur, e.clientX, e.clientY);
    }
    drawConnections();
  }
  function onUp() {
    document.body.style.cursor=''; hideTip();
    document.removeEventListener('pointermove',onMove);
    document.removeEventListener('pointerup',onUp);
    rerender();
  }
  document.addEventListener('pointermove',onMove);
  document.addEventListener('pointerup',onUp);
}

function setupBarResize(handle, bar, task) {
  handle.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    startBottomResize(bar, task, e.clientY);
  });
}

// ── Timeline bar: drag top edge to shift start time ───────────────────────────
function setupBarTopResize(handle, bar, dot, task) {
  handle.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    const startY=e.clientY, startTop=parseFloat(bar.style.top), startH=bar.offsetHeight;
    const bottomMins = yToMins(startTop + startH);
    document.body.style.cursor='n-resize';
    function onMove(e) {
      const rawTopY = startTop + (e.clientY - startY);
      const rawTopMins = yToMins(Math.max(0, rawTopY));
      const clampedTopMins = Math.max(_renderStart, Math.min(bottomMins - 15, Math.round(rawTopMins / 5) * 5));
      const newTopY = minsToY(clampedTopMins);
      const newH = minsToY(bottomMins) - newTopY;
      bar.style.top = dot.style.top = newTopY+'px';
      bar.style.height = newH+'px';
      task.sched.t = minsToTime(clampedTopMins);
      task.sched.m = Math.round((bottomMins - clampedTopMins) / 5) * 5;
      const badge=$(`.pill[data-id="${task.id}"] .time-badge`);
      if(badge) badge.textContent = task.sched.t;
      const tl=$('.tl-bar-time', bar); if(tl) tl.textContent = task.sched.t;
      showTip(task.sched.t, e.clientX, e.clientY); drawConnections();
    }
    function onUp() {
      document.body.style.cursor=''; hideTip();
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      rerender();
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
  });
}

// ── Timeline tick event: drag-to-move ────────────────────────────────────────
function setupTickDrag(tickEl, task) {
  tickEl.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('tl-tick-x')) return;
    e.preventDefault(); e.stopPropagation();
    tickEl.setPointerCapture(e.pointerId);
    const startY = e.clientY, startTop = parseFloat(tickEl.style.top);
    tickEl.classList.add('dragging');
    function onMove(e) {
      const rawY = startTop + (e.clientY - startY);
      const snapMins = Math.max(_renderStart, Math.min(tlEnd, Math.round(yToMins(Math.max(0, rawY)) / 5) * 5));
      tickEl.style.top = minsToY(snapMins)+'px';
      task.sched.t = minsToTime(snapMins);
      const badge=$(`.pill[data-id="${task.id}"] .time-badge`);
      if(badge) badge.textContent = task.sched.t;
      showTip(task.sched.t, e.clientX, e.clientY); drawConnections();
    }
    function onUp() {
      tickEl.classList.remove('dragging'); hideTip();
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      rerender();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

// ── Render timeline ───────────────────────────────────────────────────────────
function renderTimeline() {
  const panel = $('#tl-panel');
  $$('.tl-label,.tl-tick,.tl-bar,.tl-bar-dot,.tl-now-dot,.tl-now-line,.tl-tick-event', panel)
    .forEach(el=>el.remove());

  _renderStart = computeRenderStart();
  TL_HEIGHT = (tlEnd - _renderStart) * ppm;

  const taskH = $('#tasklist').offsetHeight;
  panel.style.height = Math.max(TL_HEIGHT, taskH+24)+'px';

  for (let mins=Math.ceil(_renderStart/60)*60; mins<=tlEnd; mins+=60) {
    const y=minsToY(mins);
    const tick=document.createElement('div');
    tick.className='tl-tick'; tick.style.top=y+'px';
    panel.appendChild(tick);
    const hh=mins/60, lbl=document.createElement('div');
    lbl.className='tl-label'; lbl.style.top=y+'px';
    if (y < 6) lbl.style.transform = 'translateY(2px)';
    lbl.textContent=hh<12?hh+'am':hh===12?'12pm':(hh-12)+'pm';
    panel.appendChild(lbl);
  }

  // Now indicator — only on today's view
  const now=new Date(), nowMins=now.getHours()*60+now.getMinutes();
  $$('.pill.now-active,.pill.next-up').forEach(p=>p.classList.remove('now-active','next-up'));
  const nowActiveIds = new Set();
  let nextUpId = null;
  if (!viewDate || viewDate === todayStr()) {
    const clamped=Math.max(tlStart,Math.min(tlEnd,nowMins));
    const nowY=minsToY(clamped);
    const line=document.createElement('div'); line.className='tl-now-line'; line.style.top=nowY+'px'; panel.appendChild(line);
    const dot=document.createElement('div');  dot.className='tl-now-dot';  dot.style.top=nowY+'px'; panel.appendChild(dot);
    // Mark tasks currently active, find next-up
    let nextUpStart = Infinity;
    for (const t of tasks) {
      if (!t.sched || !t.sched.t || !taskMatchesView(t)) continue;
      const start=timeToMins(t.sched.t), end=start+(t.sched.m||0);
      if (nowMins>=start && nowMins<end) {
        nowActiveIds.add(t.id);
        $(`.pill[data-id="${t.id}"]`)?.classList.add('now-active');
      } else if (start > nowMins && start < nextUpStart) {
        nextUpStart = start; nextUpId = t.id;
      }
    }
    if (nextUpId) $(`.pill[data-id="${nextUpId}"]`)?.classList.add('next-up');
  }

  // Assign lanes — all scheduled bars (events + tasks) offset together
  const toMins = t => timeToMins(t.sched.t);
  const schedSorted = tasks.filter(t=>t.sched && t.sched.t && t.sched.m>0 && taskMatchesView(t)).sort((a,b)=>toMins(a)-toMins(b));
  const laneMap = new Map();
  const laneEnd = [];
  for (const t of schedSorted) {
    const start=toMins(t), end=start+t.sched.m;
    let lane=0;
    while (laneEnd[lane]!==undefined && laneEnd[lane]>start) lane++;
    laneMap.set(t.id, lane);
    laneEnd[lane]=end;
  }

  // Duration bars — events and tasks unified, sorted by zOrder so lower ones render first
  const barTasks = tasks.filter(t=>t.sched && t.sched.t && taskMatchesView(t))
    .sort((a,b)=>(a.zOrder||0)-(b.zOrder||0));

  for (const task of barTasks) {
    const isNowActive = nowActiveIds.has(task.id);
    const isNextUp = task.id === nextUpId;
    const c = isNowActive ? '#d95f5f' : isNextUp ? '#c99820' : '#9898b4';

    // ── Tick event (zero-duration) ──
    if (task.sched.m === 0) {
      const y = timeToY(task.sched.t);
      const tickEl = document.createElement('div');
      tickEl.className = 'tl-tick-event'; tickEl.dataset.id = task.id;
      tickEl.style.cssText = `top:${y}px; background:${c};`;
      const tx = document.createElement('i'); tx.className = 'tl-tick-x'; tx.textContent = '×';
      tx.addEventListener('click', e => { e.stopPropagation(); unscheduleTask(task); });
      tickEl.appendChild(tx);
      tickEl.addEventListener('mouseenter', () => setHL(task.id, true));
      tickEl.addEventListener('mouseleave', () => setHL(task.id, false));
      setupTickDrag(tickEl, task);
      panel.appendChild(tickEl);
      continue;
    }

    const startMins=timeToMins(task.sched.t);
    const endMins=startMins+(task.sched.m||0);
    let y=minsToY(startMins);
    let barH=Math.max(minsToY(endMins)-y, 10);
    // Clamp to visible range — skip if entirely outside
    if (endMins <= _renderStart || startMins >= tlEnd) continue;
    if (y < 0) { barH = Math.max(barH + y, 4); y = 0; }
    const lane=laneMap.get(task.id)||0;
    const baseZ = task.isEvent ? 1 : 2;
    const bar=document.createElement('div');
    bar.className='tl-bar'+(task.isEvent?' event':'')+(isNowActive?' now-active':isNextUp?' next-up':'');
    bar.dataset.id=task.id; bar.dataset.lane=lane;
    bar.style.top=y+'px'; bar.style.height=barH+'px';
    bar.style.zIndex = baseZ + (task.zOrder||0);

    const dotY=Math.max(0, minsToY(startMins));
    const bdot=document.createElement('div');
    bdot.className='tl-bar-dot'; bdot.dataset.id=task.id;
    bdot.style.cssText=`top:${dotY}px; background:${c};`; panel.appendChild(bdot);

    const inner=document.createElement('div'); inner.className='tl-bar-inner'; inner.style.background=c;
    if (barH>=20) { const tl=document.createElement('div'); tl.className='tl-bar-time'; tl.textContent=task.sched.t; inner.appendChild(tl); }
    const resz=document.createElement('div'); resz.className='tl-bar-resize';
    const topH=document.createElement('div'); topH.className='tl-bar-top';
    const bx=document.createElement('i'); bx.className='tl-bar-x'; bx.textContent='×';
    bx.addEventListener('click', e=>{ e.stopPropagation(); unscheduleTask(task); });

    // z-order controls
    const zWrap=document.createElement('div'); zWrap.className='tl-bar-z';
    const zUp=document.createElement('button'); zUp.textContent='▲'; zUp.title='Bring forward';
    zUp.addEventListener('click', e=>{ e.stopPropagation(); task.zOrder=(task.zOrder||0)+1; rerender(); });
    const zDn=document.createElement('button'); zDn.textContent='▼'; zDn.title='Send back';
    zDn.addEventListener('click', e=>{ e.stopPropagation(); task.zOrder=(task.zOrder||0)-1; rerender(); });
    zWrap.append(zUp, zDn);

    bar.append(topH, inner, resz, bx, zWrap);
    bar.addEventListener('mouseenter',()=>setHL(task.id,true));
    bar.addEventListener('mouseleave',()=>setHL(task.id,false));
    setupBarDrag(bar, bdot, task);
    setupBarResize(resz, bar, task);
    setupBarTopResize(topH, bar, bdot, task);
    panel.appendChild(bar);
  }
}

// ── Render tasks ──────────────────────────────────────────────────────────────
function renderTasks() {
  const list = $('#tasklist');
  list.innerHTML = '';
  let rendered = 0;
  let prevRenderedTask = null;
  const _ts = todayStr(), _vw = viewDate || _ts;
  for (let taskIdx = 0; taskIdx < tasks.length; taskIdx++) {
    const task = tasks[taskIdx];
    const isAutoRepeater = !!(task.repeat && task.repeat.freq !== 'manual');
    const isFutureRepeater = isAutoRepeater && _vw > _ts;
    const effectiveDone = isFutureRepeater ? false : task.done;
    if (hideCompleted && effectiveDone) continue;
    if (!taskMatchesView(task)) continue;
    if (isHiddenByCollapse(taskIdx)) continue;
    const padLeft = 8+task.indent*INDENT_W;
    const row = document.createElement('div');
    row.className='task-row'+(task.isHeader?' is-header':'');
    row.dataset.id=task.id;
    row.style.paddingLeft=padLeft+'px';

    const handle=document.createElement('div');
    handle.className='drag-handle'; handle.innerHTML='⠿';

    const pill=document.createElement('div');
    pill.dataset.id=task.id;

    if (task.isHeader) {
      // ── Header row ──
      pill.className='pill';
      const canCollapse = hasChildren(taskIdx);
      const isCollapsed = collapsedIds.has(task.id);
      const icon=document.createElement('span'); icon.className='header-icon';
      icon.textContent = canCollapse ? (isCollapsed ? '▸' : '▾') : '▸';
      if (canCollapse) {
        icon.style.cursor = 'pointer';
        icon.addEventListener('click', e => {
          e.stopPropagation();
          if (collapsedIds.has(task.id)) collapsedIds.delete(task.id);
          else collapsedIds.add(task.id);
          rerender();
        });
      }
      const txt=document.createElement('div');
      txt.className='pill-text'; txt.contentEditable='true';
      txt.spellcheck=false; txt.textContent=task.text;
      const capturedPrevH = prevRenderedTask;
      txt.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); txt.blur(); }
        if (e.key === 'Tab') {
          e.preventDefault();
          const maxI = capturedPrevH ? capturedPrevH.indent + 1 : 0;
          task.indent = e.shiftKey ? Math.max(0, task.indent-1) : Math.min(maxI, task.indent+1);
          rerender();
          setTimeout(() => { const el=$(`.pill[data-id="${task.id}"] .pill-text`); if(el){el.focus();placeCaretAtEnd(el);} }, 30);
        }
      });
      txt.addEventListener('blur',()=>{const v=txt.textContent.trim();if(v){task.text=v;saveToStorage();}});
      const del=document.createElement('i'); del.className='header-del'; del.textContent='×';
      del.addEventListener('click', e => {
        e.stopPropagation();
        const subtree = getSubtree(task);
        tasks = tasks.filter(t => !subtree.includes(t));
        rerender();
      });
      const hMenuBtn = document.createElement('button'); hMenuBtn.className = 'task-menu-btn'; hMenuBtn.textContent = '⋯';
      hMenuBtn.addEventListener('pointerdown', e => { e.stopPropagation(); openTaskMenu(task, hMenuBtn); });
      pill.append(icon, txt, del, hMenuBtn);
    } else {
      // ── Task / Event row ──
      const isUnscheduled = !effectiveDone && (!task.sched || !task.sched.t);
      pill.className='pill'+(effectiveDone?' done':'')+(task.sched?' sched':'')+(task.isEvent?' is-event':'')+(isUnscheduled?' unscheduled':'');
      if(task.sched) pill.style.borderLeftColor=task.color||'#9898b4';
      if(selectedIds.has(task.id)) pill.classList.add('selected');

      if (task.isEvent) {
        // Events: block icon instead of checkbox
        const icon=document.createElement('div'); icon.className='pill-event-icon'; icon.textContent='▬';
        pill.appendChild(icon);
      } else {
        const chk=document.createElement('div');
        chk.className='pill-chk'+(effectiveDone?' done':'');
        chk.addEventListener('click',()=>{
          if(isFutureRepeater) return; // future occurrence — can't mark done
          task.done=!task.done;
          if(task.done && !isAutoRepeater) task.sched=null; // don't clear repeater's schedule
          rerender();
        });
        pill.appendChild(chk);
      }

      const txt=document.createElement('div');
      txt.className='pill-text'; txt.contentEditable='true';
      txt.spellcheck=false; txt.textContent=task.text;
      const capturedPrevT = prevRenderedTask;
      txt.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault(); txt.blur();
          // create a new task below at same indent
          const newTask = { id:++uid, text:'', isHeader:false, done:false, indent:task.indent,
            color:null, sched: task.sched?.date ? {date:task.sched.date} : null };
          tasks.splice(taskIdx+1, 0, newTask);
          rerender();
          setTimeout(() => { const el=$(`.pill[data-id="${newTask.id}"] .pill-text`); if(el) el.focus(); }, 40);
        }
        if (e.key === 'Tab') {
          e.preventDefault();
          const maxI = capturedPrevT ? capturedPrevT.indent + 1 : 0;
          task.indent = e.shiftKey ? Math.max(0, task.indent-1) : Math.min(maxI, task.indent+1);
          rerender();
          setTimeout(() => { const el=$(`.pill[data-id="${task.id}"] .pill-text`); if(el){el.focus();placeCaretAtEnd(el);} }, 30);
        }
      });
      txt.addEventListener('blur',()=>{const v=txt.textContent.trim();if(v!==undefined){task.text=v||task.text;saveToStorage();}});

      // Event toggle button (visible on row hover)
      const evtBtn=document.createElement('button'); evtBtn.className='evt-toggle'+(task.isEvent?' on':'');
      evtBtn.textContent=task.isEvent?'event':'evt';
      evtBtn.title=task.isEvent?'Switch to task':'Switch to event';
      evtBtn.addEventListener('click', e=>{ e.stopPropagation(); task.isEvent=!task.isEvent; rerender(); });

      // Notes button
      const notesBtn=document.createElement('button');
      notesBtn.className='notes-btn'+(task.notes?' has-notes':'');
      notesBtn.title=task.notes?'Edit notes':'Add notes'; notesBtn.textContent='✎';
      notesBtn.addEventListener('click', e=>{ e.stopPropagation(); openNotesModal(task, () => rerender()); });

      // Move to project or folder button
      const moveBtn=document.createElement('button');
      moveBtn.className='move-btn';
      if (task.folderId) {
        const fn=(folders.find(f=>f.id===task.folderId)||{}).name;
        if (fn) { moveBtn.textContent='▤ '+fn; moveBtn.style.opacity='1'; moveBtn.style.color='#4f46e5'; moveBtn.title='In folder: '+fn; }
        else { moveBtn.textContent='→'; moveBtn.title='Move to…'; }
      } else {
        moveBtn.textContent='→'; moveBtn.title='Move to…';
      }
      moveBtn.addEventListener('click', e=>{
        e.stopPropagation();
        showMovePicker(moveBtn, proj=>moveTaskToProject(task,proj), folder=>moveTaskToFolder(task,folder));
      });

      // Repeat — badge if active, plain button if not
      let repeatEl;
      if (task.repeat) {
        const DAY_ABB = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
        const label = task.repeat.freq === 'daily' ? '↻ daily'
          : task.repeat.freq === 'weekly' ? `↻ ${DAY_ABB[task.repeat.day]}`
          : task.repeat.freq === 'manual' ? `↻ ${task.repeat.timesPerWeek||1}×/wk`
          : `↻ ${task.repeat.dayOfMonth}th`;
        repeatEl = document.createElement('button');
        repeatEl.className = 'repeat-badge';
        repeatEl.textContent = label;
        repeatEl.addEventListener('click', e => { e.stopPropagation(); openRepeatModal(task); });
      } else {
        repeatEl = document.createElement('button');
        repeatEl.className = 'repeat-btn'; repeatEl.title = 'Set repeat'; repeatEl.textContent = '↻';
        repeatEl.addEventListener('click', e => { e.stopPropagation(); openRepeatModal(task); });
      }

      const dateBtn = document.createElement('button');
      dateBtn.className = 'date-btn' + (task.sched?.date ? ' has-date' : '');
      dateBtn.title = task.sched?.date ? `Date: ${task.sched.date}` : 'Set date';
      dateBtn.textContent = 'date';
      dateBtn.addEventListener('click', e => {
        e.stopPropagation();
        datePanelTarget = task;
        openDatePanel(dateBtn);
      });

      const taskDel = document.createElement('i'); taskDel.className = 'task-del'; taskDel.textContent = '×';
      taskDel.addEventListener('click', e => {
        e.stopPropagation();
        const subtree = getSubtree(task);
        tasks = tasks.filter(t => !subtree.includes(t));
        saveToStorage();
        rerender();
      });

      pill.append(txt, evtBtn, notesBtn, moveBtn, repeatEl, dateBtn, taskDel);

      if (task.sched) {
        const c=task.color||'#9898b4';
        const wrap=document.createElement('div'); wrap.className='time-badge-wrap';
        const badge=document.createElement('div');
        badge.className='time-badge'; badge.textContent=task.sched.t;
        badge.style.cssText=`background:rgba(${hexRgb(c)},.1);color:${c};cursor:pointer;`;
        badge.title=minsStr(task.sched.m);
        badge.addEventListener('click', e=>{ e.stopPropagation(); openSchedModal(task); });
        const bx=document.createElement('i'); bx.className='time-badge-x'; bx.textContent='×';
        bx.addEventListener('click', e=>{ e.stopPropagation(); unscheduleTask(task); });
        wrap.append(badge, bx);
        pill.appendChild(wrap);
      } else if (!task.isHeader) {
        const schedBtn = document.createElement('button'); schedBtn.className = 'sched-btn';
        schedBtn.textContent = '⏱'; schedBtn.title = 'Set time';
        schedBtn.addEventListener('click', e => { e.stopPropagation(); openSchedModal(task); });
        pill.appendChild(schedBtn);
      }

      const menuBtn = document.createElement('button'); menuBtn.className = 'task-menu-btn'; menuBtn.textContent = '⋯';
      menuBtn.addEventListener('pointerdown', e => { e.stopPropagation(); openTaskMenu(task, menuBtn); });
      pill.appendChild(menuBtn);

      pill.addEventListener('mouseenter',()=>setHL(task.id,true));
      pill.addEventListener('mouseleave',()=>setHL(task.id,false));

      // Cmd+click to select
      pill.addEventListener('mousedown', e => {
        if (e.metaKey || e.ctrlKey) {
          e.preventDefault(); e.stopPropagation();
          if (selectedIds.has(task.id)) selectedIds.delete(task.id);
          else selectedIds.add(task.id);
          pill.classList.toggle('selected', selectedIds.has(task.id));
        }
      });
    }

    // Collapse toggle: placed inside the pill so it doesn't shift the pill's position
    if (!task.isHeader && hasChildren(taskIdx)) {
      const isCollapsed = collapsedIds.has(task.id);
      const collBtn = document.createElement('div');
      collBtn.className = 'collapse-btn' + (isCollapsed ? ' active' : '');
      collBtn.textContent = isCollapsed ? '▸' : '▾';
      collBtn.title = isCollapsed ? 'Expand' : 'Collapse';
      collBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (collapsedIds.has(task.id)) collapsedIds.delete(task.id);
        else collapsedIds.add(task.id);
        rerender();
      });
      pill.insertBefore(collBtn, pill.firstChild);
    }
    row.append(handle, pill);
    setupDrag(handle, row, task);
    list.appendChild(row);
    rendered++;
    prevRenderedTask = task;
  }
}

// ── Cross-highlight ───────────────────────────────────────────────────────────
function setHL(id, on) {
  $(`.tl-bar[data-id="${id}"]`)?.classList.toggle('hl', on);
  $(`.tl-tick-event[data-id="${id}"]`)?.classList.toggle('hl', on);
  $(`.pill[data-id="${id}"]`)?.classList.toggle('hl', on);
  $(`.conn[data-id="${id}"]`)?.classList.toggle('hl', on);
}

// ── Connections ───────────────────────────────────────────────────────────────
function drawConnections() {
  const svg=$('#connections'), root=$('#card-body'), rR=root.getBoundingClientRect();
  svg.setAttribute('width',rR.width); svg.setAttribute('height',root.offsetHeight);
  svg.classList.toggle('hidden', !wiresVisible);
  svg.innerHTML='';
  for (const task of tasks) {
    if (!task.sched || !taskMatchesView(task)) continue;
    const bar=$(`.tl-bar[data-id="${task.id}"]`) || $(`.tl-tick-event[data-id="${task.id}"]`);
    const pill=$(`.pill[data-id="${task.id}"]`);
    if (!bar||!pill) continue;
    const bR=bar.getBoundingClientRect(), pR=pill.getBoundingClientRect();
    const isTick=bar.classList.contains('tl-tick-event');
    const x1=bR.right-rR.left, y1=bR.top-rR.top+bR.height*(isTick?0.5:0.28);
    const x2=pR.left-rR.left,  y2=pR.top-rR.top+pR.height*.5;
    const span=x2-x1;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('class','conn'); path.dataset.id=task.id;
    path.setAttribute('stroke',task.color||'#9898b4');
    path.setAttribute('d',`M${x1} ${y1} C${x1+span*.55} ${y1},${x1+span*.45} ${y2},${x2} ${y2}`);
    svg.appendChild(path);
  }
}

// ── Date panel ────────────────────────────────────────────────────────────────
let expandedMonth = -1;
let datePanelTarget = null;   // task to assign date to (null = view navigation)
let datePanelByDrag = false;  // was panel opened by drag-to-right-edge?

function buildDatePanel() {
  const today = new Date();
  const todayY = today.getFullYear();
  const todayM = today.getMonth();
  const container = $('#date-months');
  container.innerHTML = '';

  // Update year label and today button visibility
  const yearEl = $('#dp-year');
  if (yearEl) yearEl.textContent = panelYear;
  const todayBtn = $('#dp-today');
  if (todayBtn) todayBtn.style.display = panelYear === todayY ? 'none' : '';

  // Show all 12 months
  for (let m = 0; m < 12; m++) {
    const isCur = m === todayM && panelYear === todayY;
    const slot = document.createElement('div');
    slot.className = 'month-slot' + (isCur ? ' cur' : '');
    slot.dataset.month = m;
    const lbl = document.createElement('div');
    lbl.className = 'month-label';
    lbl.textContent = MONTH_NAMES[m];
    slot.appendChild(lbl);
    slot.addEventListener('mouseenter', () => expandDateMonth(m));
    container.appendChild(slot);
  }
  syncDatePanelHeight();
}

function expandDateMonth(month) {
  if (expandedMonth === month) return;
  expandedMonth = month;

  // Mark active month in left column
  $$('.month-slot').forEach(slot => {
    slot.classList.toggle('expanded', parseInt(slot.dataset.month) === month);
  });

  // Render days into the shared right column
  const grid  = $('#date-days-grid');
  const label = $('#date-days-label');
  const empty = $('#date-days-empty');
  label.textContent = MONTH_NAMES[month];
  label.style.display = '';
  empty.style.display = 'none';

  grid.innerHTML = '';
  const today = new Date();
  const daysInMonth = new Date(panelYear, month + 1, 0).getDate();
  const firstDow    = (new Date(panelYear, month, 1).getDay() + 6) % 7; // Mon=0
  const taskDates   = new Set(tasks.filter(t => t.sched?.date).map(t => t.sched.date));

  // Day-of-week headers
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(d => {
    const h = document.createElement('div'); h.className = 'dp-dow'; h.textContent = d;
    grid.appendChild(h);
  });

  for (let i = 0; i < firstDow; i++) {
    const e = document.createElement('div'); e.className = 'day-cell empty'; grid.appendChild(e);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${panelYear}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    cell.dataset.date = dateStr;
    cell.textContent = d;
    cell.style.animationDelay = `${d * 6}ms`;
    if (d === today.getDate() && month === today.getMonth() && panelYear === today.getFullYear())
      cell.classList.add('today');
    if (taskDates.has(dateStr)) cell.classList.add('has-task');
    if (dateStr === viewDate) cell.classList.add('selected-day');
    cell.addEventListener('click', () => {
      if (drag) return; // drag handles its own selection
      if (datePanelTarget) {
        const t = datePanelTarget;
        t.sched = t.sched ? { ...t.sched, date: dateStr } : { date: dateStr };
        datePanelTarget = null;
        closeDatePanel();
        saveToStorage();
        rerender();
      } else {
        browseDate(dateStr);
        closeDatePanel();
      }
    });
    grid.appendChild(cell);
  }
}

function datePanelIsOpen() {
  return $('#date-panel').classList.contains('open');
}

function openDatePanel(anchorEl) {
  datePanelByDrag = false;
  // Navigate to the month of the current viewDate if set
  if (viewDate) {
    const [y] = viewDate.split('-').map(Number);
    if (panelYear !== y) panelYear = y;
  }
  expandedMonth = -1;
  buildDatePanel();

  const panel = $('#date-panel');
  panel.classList.add('open');
  if (!anchorEl) $('#btn-cal-toggle')?.classList.add('panel-open');

  // Position the panel: below anchorEl (defaults to cal-toggle button), clamped to viewport
  const anchor = anchorEl || $('#btn-cal-toggle');
  const aR = anchor.getBoundingClientRect();
  const pw = 268, ph = 330;
  let left = aR.left;
  let top  = aR.bottom + 5;
  left = Math.max(6, Math.min(left, window.innerWidth  - pw - 6));
  top  = Math.max(6, Math.min(top,  window.innerHeight - ph - 6));
  panel.style.left = left + 'px';
  panel.style.top  = top  + 'px';

  // Pick which month to expand — prefer task's date, then viewDate, then today
  const today = new Date();
  const refDate = datePanelTarget?.sched?.date || viewDate || null;
  if (refDate) {
    const [ry] = refDate.split('-').map(Number);
    if (panelYear !== ry) { panelYear = ry; buildDatePanel(); }
  }
  const targetM = refDate
    ? parseInt(refDate.split('-')[1]) - 1
    : panelYear === today.getFullYear() ? today.getMonth() : 0;
  expandDateMonth(targetM);
  if (refDate) {
    const cell = $(`.day-cell[data-date="${refDate}"]`);
    if (cell) cell.classList.add('selected-day');
  }
}

function openDatePanelForDrag(nearX, nearY) {
  if (datePanelIsOpen()) return; // already open, don't reposition
  const panel = $('#date-panel');
  const pw = 268, ph = 330;
  let left = nearX + 18;
  let top  = nearY - 60;
  left = Math.max(6, Math.min(left, window.innerWidth  - pw - 6));
  top  = Math.max(6, Math.min(top,  window.innerHeight - ph - 6));
  panel.style.left = left + 'px';
  panel.style.top  = top  + 'px';
  datePanelByDrag = true;
  expandedMonth = -1;
  buildDatePanel();
  panel.classList.add('open');
  const today = new Date();
  expandDateMonth(today.getMonth());
}

function openDateModal() {
  if (viewDate) { const [y] = viewDate.split('-').map(Number); if (panelYear !== y) panelYear = y; }
  expandedMonth = -1;
  buildDatePanel();
  const panel = $('#date-panel');
  const pw = 268, ph = 330;
  panel.style.left = Math.round((window.innerWidth  - pw) / 2) + 'px';

  const targetM = refDate ? parseInt(refDate.split('-')[1]) - 1 : panelYear === today.getFullYear() ? today.getMonth() : 0;
  expandDateMonth(targetM);
  if (refDate) { const cell = $(`.day-cell[data-date="${refDate}"]`); if (cell) cell.classList.add('selected-day'); }
  const focusStart = refDate || todayStr();

// ── Date panel keyboard navigation ────────────────────────────────────────────
let dpFocusDate = null;

function dpSetFocus(dateStr) {
  dpFocusDate = dateStr;
  const [y, m] = dateStr.split('-').map(Number);
  if (panelYear !== y) { panelYear = y; buildDatePanel(); }
  if (expandedMonth !== m - 1) expandDateMonth(m - 1);

function dpMoveFocus(n) {
  if (!dpFocusDate) return;
  const [y, mo, d] = dpFocusDate.split('-').map(Number);
  const dt = new Date(y, mo - 1, d);
  dt.setDate(dt.getDate() + n);
  dpSetFocus(`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`);
}

function dpSelectFocus() {
  if (!dpFocusDate) return;
  if (datePanelTarget) {
    const t = datePanelTarget;
    t.sched = t.sched ? { ...t.sched, date: dpFocusDate } : { date: dpFocusDate };
    datePanelTarget = null;
    closeDatePanel(); saveToStorage(); rerender();
  } else {
    browseDate(dpFocusDate); closeDatePanel();

function closeDatePanel() {
  datePanelTarget = null;
  dpFocusDate = null;
  datePanelByDrag = false;
  $('#date-panel').classList.remove('open');
  $('#btn-cal-toggle')?.classList.remove('panel-open');

  const grid = $('#date-days-grid'); if (grid) grid.innerHTML = '';

// ── Browse date (no drag) ─────────────────────────────────────────────────────
const DAYS_LONG   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function todayStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

// Does this task belong to the currently-viewed date?
// Children inherit their date from the nearest ancestor header if they have none of their own.
function taskMatchesView(task) {
  const ts = todayStr();
  const viewing = viewDate || ts;

  // ── Repeating task ──────────────────────────────────────────────────
  if (task.repeat) {
    const freq = task.repeat.freq;
    if (freq === 'manual') return false;  // manual repeaters: templates only, not in schedule
    const startDate = task.sched?.date || ts;
    if (viewing < startDate) return false;
    if (task.repeat.until && viewing > task.repeat.until) return false;
    if (viewing > ts && !showFutureRepeaters) return false;
    if (freq === 'daily') return true;
    const [vy, vm, vd] = viewing.split('-').map(Number);
    const vDate = new Date(vy, vm - 1, vd);
    if (freq === 'weekly') {
      const dow = (vDate.getDay() + 6) % 7; // 0=Mon
      return dow === task.repeat.day;
    }
    if (freq === 'monthly') return vd === task.repeat.dayOfMonth;
    return false;
  }

  // ── Normal task ─────────────────────────────────────────────────────
  // Folder tasks only appear in schedule when explicitly scheduled
  if (task.folderId != null && !task.sched) return false;

  const isToday = viewing === ts;
  let taskDate = task.sched?.date ?? null;
  if (!taskDate && task.indent > 0) {
    const idx = tasks.indexOf(task);
    for (let i = idx - 1; i >= 0; i--) {
      if (tasks[i].indent < task.indent) { taskDate = tasks[i].sched?.date ?? null; break; }
    }
  }
  if (!isToday) return taskDate === viewing;
  return !taskDate || taskDate === ts || (taskDate < ts && !task.done);
}

// ── View mode (day / week) ────────────────────────────────────────────────────
let viewMode = 'day';

function dateToStr(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

function weekStartOf(dateStr) {
  // Monday of the week containing dateStr
  const d = new Date((dateStr || todayStr()) + 'T00:00:00');
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return d;
}

function setViewMode(mode) {
  viewMode = mode;
  $('#btn-view-day').classList.toggle('active', mode === 'day');
  $('#btn-view-week').classList.toggle('active', mode === 'week');
  const isWeek = mode === 'week';
  $('#task-panel').style.display  = isWeek ? 'none' : '';
  $('#connections').style.display = isWeek ? 'none' : '';
  $('#week-panel').style.display  = isWeek ? '' : 'none';
  updateHeader();
  if (isWeek) { renderWeek(); renderTimeline(); } else rerender();
}

function focusWeekDay(ds) {
  const ts = todayStr();
  viewDate = ds === ts ? null : ds;
  // Update focused column highlight
  $$('.week-col').forEach(col => {
    col.classList.toggle('is-viewing', col.dataset.date === ds);
  });
  renderTimeline();
}

function renderWeek() {
  const panel = $('#week-panel');
  panel.innerHTML = '';
  const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const ts = todayStr();
  const viewing = viewDate || ts;
  const weekStart = weekStartOf(viewing);

  const grid = document.createElement('div');
  grid.className = 'week-grid';

  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    const ds = dateToStr(d);
    const isToday = ds === ts;
    const isViewing = ds === viewing;

    const col = document.createElement('div');
    col.className = 'week-col' + (isToday ? ' is-today' : '') + (isViewing ? ' is-viewing' : '');
    col.dataset.date = ds;

    const hdr = document.createElement('div'); hdr.className = 'week-col-hdr';
    const dowLbl = document.createElement('div'); dowLbl.className = 'week-dow-lbl'; dowLbl.textContent = DOW[i];
    const dateNum = document.createElement('div'); dateNum.className = 'week-date-num'; dateNum.textContent = d.getDate();
    hdr.append(dowLbl, dateNum);
    hdr.title = `${DOW[i]} ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`;
    // Click header → focus this day's timeline (stay in week view)
    hdr.addEventListener('click', () => focusWeekDay(ds));
    col.appendChild(hdr);

    const divider = document.createElement('div'); divider.className = 'week-col-divider';
    col.appendChild(divider);

    // Tasks matching this day
    const saved = viewDate;
    viewDate = ds;
    const dayTasks = tasks.filter(t => taskMatchesView(t) && !t.done);
    viewDate = saved;

    dayTasks.forEach(task => {
      const item = document.createElement('div');
      item.className = 'week-task' + (task.isHeader ? ' wt-header' : '');
      const dot = document.createElement('div'); dot.className = 'week-task-dot';
      const txt = document.createElement('div'); txt.className = 'week-task-text';
      txt.textContent = task.text; txt.title = task.text;
      item.append(dot, txt);
      item.addEventListener('click', () => focusWeekDay(ds));
      item.addEventListener('dblclick', () => { focusWeekDay(ds); setViewMode('day'); });

      if (!task.isHeader) {
        // ── Unschedule button ──
        const del = document.createElement('button'); del.className = 'week-task-del'; del.textContent = '×';
        del.title = 'Remove from schedule';
        del.addEventListener('click', e => { e.stopPropagation(); unscheduleTask(task); });
        item.appendChild(del);

        // ── Drag to reschedule ──
        item.draggable = true;
        item.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', String(task.id));
          e.dataTransfer.effectAllowed = 'move';
          setTimeout(() => item.style.opacity = '0.4', 0);
        });
        item.addEventListener('dragend', () => item.style.opacity = '');
      }

      col.appendChild(item);
    });

    // ── Add task button ──
    const addBtn = document.createElement('button'); addBtn.className = 'week-add-btn'; addBtn.textContent = '+';
    addBtn.title = `Add task for ${DOW[i]}`;
    addBtn.addEventListener('click', e => { e.stopPropagation(); focusWeekDay(ds); openAddModal(ds); });
    col.appendChild(addBtn);

    // ── Drop target ──
    col.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; col.classList.add('week-drag-over'); });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('week-drag-over'); });
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('week-drag-over');
      const taskId = parseInt(e.dataTransfer.getData('text/plain'));
      const task = tasks.find(t => t.id === taskId); if (!task) return;
      if (task.sched) task.sched = { ...task.sched, date: ds };
      else task.sched = { date: ds };
      focusWeekDay(ds);
      saveToStorage(); renderWeek(); renderTimeline();
    });

    grid.appendChild(col);
  }
  panel.appendChild(grid);
}

function updateHeader() {
  const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const ts = todayStr();
  const isToday = !viewDate || viewDate === ts;
  if (isToday) viewDate = null;

  if (viewMode === 'week') {
    const ws = weekStartOf(viewDate);
    const we = new Date(ws); we.setDate(we.getDate() + 6);
    const sameMonth = ws.getMonth() === we.getMonth();
    const label = sameMonth
      ? `${ws.getDate()}–${we.getDate()} ${MONTHS_SHORT[ws.getMonth()]}`
      : `${ws.getDate()} ${MONTHS_SHORT[ws.getMonth()]} – ${we.getDate()} ${MONTHS_SHORT[we.getMonth()]}`;
    $('#header-h1').textContent = label;
  } else {
    const dateStr = viewDate || ts;
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const isThisYear = y === new Date().getFullYear();
    $('#header-h1').textContent = `${DAYS_SHORT[dt.getDay()]}, ${d} ${MONTHS_SHORT[m-1]}${isThisYear ? '' : ' ' + y}`;
  }
  $('#header-sub').textContent = '';
}

function goPrevDay() {
  const delta = viewMode === 'week' ? 7 : 1;
  const ts = todayStr();
  const cur = viewDate || ts;
  const [y,m,d] = cur.split('-').map(Number);
  const dt = new Date(y, m-1, d); dt.setDate(dt.getDate() - delta);
  viewDate = dateToStr(dt);
  updateHeader();
  if (viewMode === 'week') renderWeek(); else rerender();
}

function goNextDay() {
  const delta = viewMode === 'week' ? 7 : 1;
  const ts = todayStr();
  const cur = viewDate || ts;
  const [y,m,d] = cur.split('-').map(Number);
  const dt = new Date(y, m-1, d); dt.setDate(dt.getDate() + delta);
  const next = dateToStr(dt);
  viewDate = next === ts ? null : next;
  updateHeader();
  if (viewMode === 'week') renderWeek(); else rerender();
}

function browseDate(dateStr) {
  viewDate = dateStr;
  updateHeader();
  rerender();
  // Re-mark selected cell after rerender rebuilds the grid
  requestAnimationFrame(() => {
    $$('.day-cell.selected-day').forEach(c => c.classList.remove('selected-day'));
    const cell = $(`.day-cell[data-date="${dateStr}"]`);
    if (cell) cell.classList.add('selected-day');
  });
}
function syncDatePanelHeight() { /* no-op: panel is now fixed position */ }

// ── Mini ghost for date-panel dragging ────────────────────────────────────────
let miniGhostEl = null;
function showMiniGhost(task, x, y) {
  if (!miniGhostEl) {
    miniGhostEl = document.createElement('div');
    miniGhostEl.style.cssText = [
      'position:fixed','pointer-events:none','z-index:9999',
      'background:#fff','border-radius:8px','padding:4px 10px 4px 7px',
      'font-size:11px','font-weight:600','color:#333',
      'box-shadow:0 4px 16px rgba(0,0,0,.18)',
      'border:1px solid #e0e0f0',
      'display:flex','align-items:center','gap:6px','white-space:nowrap',
      'transition:none'
    ].join(';');
    const dot = document.createElement('div');

    const txt = document.createElement('span');
    txt.textContent = task.text.length>22 ? task.text.slice(0,22)+'…' : task.text;
    miniGhostEl.append(dot, txt);
    document.body.appendChild(miniGhostEl);
  }
  miniGhostEl.style.left = (x+14)+'px';
  miniGhostEl.style.top  = (y-26)+'px';
}
function hideMiniGhost() {
  if (miniGhostEl) { miniGhostEl.remove(); miniGhostEl=null; }
}

// ── Task drag ─────────────────────────────────────────────────────────────────
let drag = null;
let dropEl = null;
let tlPreviewEl = null;

function getSubtree(task) {
  const idx=tasks.indexOf(task), group=[task];
  for (let i=idx+1;i<tasks.length;i++) {
    if(tasks[i].indent>task.indent) group.push(tasks[i]); else break;
  }
  return group;
}

// Returns the max indent allowed when dropping before `dropBeforeId`, skipping `excludeIds`.
// Rule: can only be one level deeper than the task directly above the drop position.
function maxIndentAtDrop(dropBeforeId, excludeIds) {
  let lastVisible = null;
  for (let i = 0; i < tasks.length; i++) {
    const t = tasks[i];
    if (excludeIds.has(t.id)) continue;
    if (!taskMatchesView(t)) continue;
    if (isHiddenByCollapse(i)) continue;
    if (dropBeforeId !== null && t.id === dropBeforeId) break;
    lastVisible = t;
  }
  return lastVisible ? lastVisible.indent + 1 : 0;
}

function setupDrag(handle, row, task) {
  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging-active');
    const pillEl=row.querySelector('.pill'), pR=pillEl.getBoundingClientRect();
    const subtree=getSubtree(task);

    // Ghost pill
    const ghost=document.createElement('div');
    ghost.className='drag-ghost';
    if (task.sched) { ghost.style.borderLeftWidth='2.5px'; ghost.style.borderLeftColor=task.color||'#9898b4'; }
    if (subtree.length>1) ghost.style.boxShadow='0 10px 32px rgba(0,0,0,.16),3px 4px 0 1px rgba(0,0,0,.06),6px 8px 0 1px rgba(0,0,0,.03)';
    ghost.style.cssText+=`width:${pR.width}px;left:${pR.left}px;top:${pR.top}px;`;
    const gChk=document.createElement('div'); gChk.className='pill-chk'+(task.done?' done':'');
    const gTxt=document.createElement('div');
    gTxt.style.cssText='flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;';
    gTxt.textContent=task.text; ghost.append(gChk,gTxt);
    if (subtree.length>1) {
      const badge=document.createElement('div');
      badge.style.cssText='font-size:10px;color:#888;white-space:nowrap;flex-shrink:0;padding-left:4px;';
      badge.textContent=`+${subtree.length-1}`; ghost.appendChild(badge);
    }
    document.body.appendChild(ghost);

    // Drop indicator
    dropEl=document.createElement('div'); dropEl.className='drop-indicator';
    $('#task-panel').appendChild(dropEl);

    // Fade subtree rows
    subtree.forEach(t=>{ const r=$(`.task-row[data-id="${t.id}"]`); if(r) r.style.opacity='.3'; });

    drag={task, subtree, ghost,
      startX:e.clientX, startY:e.clientY,
      offX:e.clientX-pR.left, offY:e.clientY-pR.top,
      dropBeforeId:null, dropIndent:task.indent,
      tlDropTime:null, dropDate:null };

    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup',   onDragUp);
  });
}

function onDragMove(e) {
  if (!drag) return;
  const {ghost,startX,offX,offY,task,subtree} = drag;
  ghost.style.left=(e.clientX-offX)+'px';
  ghost.style.top =(e.clientY-offY)+'px';

  const tlRect=$('#tl-panel').getBoundingClientRect();
  const tpRect=$('#task-panel').getBoundingClientRect();
  const subtreeIds=new Set(subtree.map(t=>t.id));

  // ── Zone: LEFT — drop on timeline to schedule ──────────────────────────────
  if (e.clientX >= tlRect.left && e.clientX <= tlRect.right) {
    drag.dropDate=null; drag.dropBeforeId=null;
    const relY=e.clientY-tlRect.top;
    const snapMins=Math.max(_renderStart, Math.min(tlEnd-15, Math.round(yToMins(Math.max(0,relY))/5)*5));
    const snapY=minsToY(snapMins);
    drag.tlDropTime=minsToTime(snapMins);

    if (!tlPreviewEl) {
      tlPreviewEl=document.createElement('div');
      tlPreviewEl.className='tl-bar preview';
      $('#tl-panel').appendChild(tlPreviewEl);
    }
    tlPreviewEl.style.top=snapY+'px';
    tlPreviewEl.style.height=(minsToY(snapMins+15)-snapY)+'px';
    tlPreviewEl.style.background=task.color||'#9898b4';

    if (dropEl) dropEl.style.visibility='hidden';
    $$('.day-cell.drag-over').forEach(d=>d.classList.remove('drag-over'));
    showTip(drag.tlDropTime, e.clientX, e.clientY);
    return;
  }

  // Not over timeline: clear preview
  if (tlPreviewEl) { tlPreviewEl.remove(); tlPreviewEl=null; }
  drag.tlDropTime=null;

  // ── Zone: CAL BUTTON — drag over date header to schedule on a picked date ──
  const calBtn=$('#btn-cal-toggle');
  const calR=calBtn.getBoundingClientRect();
  const overCal=e.clientX>=calR.left&&e.clientX<=calR.right&&e.clientY>=calR.top&&e.clientY<=calR.bottom;
  calBtn.classList.toggle('drag-over-cal', overCal);
  drag.overCalBtn=overCal;
  ghost.style.opacity=overCal?'0.4':'0.93';
  drag.dropDate=null;
  if (dropEl) dropEl.style.visibility='';

  // ── Zone: MIDDLE — normal reorder ─────────────────────────────────────────
  $$('.day-cell.drag-over').forEach(d=>d.classList.remove('drag-over'));
  const panelR=$('#task-panel').getBoundingClientRect();
  const rows=$$('.task-row');
  let beforeId=null, rowY=panelR.height-8;

  // Find the dragged task's parent (nearest ancestor with lower indent) so we
  // can use a tighter drop threshold for it — prevents accidentally dragging
  // a grouped task above its own group header.
  const origTaskIdx = tasks.indexOf(task);
  let parentTaskId = null;
  for (let k = origTaskIdx - 1; k >= 0; k--) {
    if (tasks[k].indent < task.indent) { parentTaskId = tasks[k].id; break; }
  }

  for (const r of rows) {
    if (subtreeIds.has(+r.dataset.id)) continue;
    const rR=r.getBoundingClientRect();
    // Parent row requires cursor in top 15% of row; all other rows use midpoint.
    const thresh = (+r.dataset.id === parentTaskId) ? rR.height * 0.15 : rR.height * 0.5;
    if (e.clientY < rR.top + thresh) { beforeId=+r.dataset.id; rowY=rR.top-panelR.top; break; }
    rowY=rR.bottom-panelR.top;
  }

  drag.dropBeforeId=beforeId;

  const dx=e.clientX-startX;
  const maxI=maxIndentAtDrop(beforeId,subtreeIds);
  drag.dropIndent=Math.max(0,Math.min(maxI,task.indent+Math.round(dx/INDENT_W)));
  const indentPx=8+drag.dropIndent*INDENT_W+20;
  if (dropEl) dropEl.style.cssText=`top:${rowY}px;left:${indentPx}px;right:14px;`;

  hideTip();
}

function onDragUp(e) {
  if (!drag) return;
  document.body.classList.remove('dragging-active');
  const {task, subtree, ghost, dropBeforeId, dropIndent, tlDropTime, dropDate, overCalBtn} = drag;
  ghost.remove();
  if (dropEl) { dropEl.remove(); dropEl=null; }
  if (tlPreviewEl) { tlPreviewEl.remove(); tlPreviewEl=null; }
  $$('.day-cell.drag-over').forEach(d=>d.classList.remove('drag-over'));
  $('#btn-cal-toggle').classList.remove('drag-over-cal');
  $$('.task-row').forEach(r=>r.style.opacity='');
  hideTip(); hideMiniGhost();

  if (overCalBtn) {
    // ── Dropped on cal button → open date picker, user selects a date ───────
    drag=null;
    document.removeEventListener('pointermove',onDragMove);
    document.removeEventListener('pointerup',onDragUp);
    datePanelTarget = task;
    openDatePanel($('#btn-cal-toggle'));
    return;
  }

  if (tlDropTime) {
    // ── Dropped on timeline → pin start time, then drag to set duration ─────
    if (!task.color) task.color='#9898b4';
    const schedDate = viewDate && viewDate !== todayStr() ? viewDate : (task.sched?.date ?? null);
    task.sched={ t:tlDropTime, m:30, ...(schedDate ? {date:schedDate} : {}) };
    const dropClientY = e.clientY;
    const isTouch = e.pointerType === 'touch';
    $$('.task-row').forEach(r=>r.style.opacity='');
    drag=null;
    document.removeEventListener('pointermove',onDragMove);
    document.removeEventListener('pointerup',onDragUp);
    if (isTouch) {
      // On touch: can't drag-resize after drop; open schedule modal instead
      saveToStorage(); rerender();
      requestAnimationFrame(() => openSchedModal(task));
    } else {
      // Desktop: render tick then immediately start bottom-resize drag
      task.sched.m = 0;
      renderTasks();
      requestAnimationFrame(()=>{
        renderTimeline(); syncDatePanelHeight();
        requestAnimationFrame(()=>{
          drawConnections();
          const newEl = $(`.tl-tick-event[data-id="${task.id}"]`) || $(`.tl-bar[data-id="${task.id}"]`);
          if (newEl) startBottomResize(newEl, task, dropClientY, 0);
        });
      });
    }
    return; // skip the shared cleanup below

  } else if (dropDate) {
    // ── Dropped on date panel → reschedule selected (or subtree) ───────────
    const targets = selectedIds.size>0 ? tasks.filter(t=>selectedIds.has(t.id)) : subtree;
    targets.forEach(t => {
      if (t.isHeader) {
        t.sched = t.sched ? {...t.sched, date:dropDate} : {date:dropDate};
      } else {
        if (!t.sched) { if(!t.color) t.color='#9898b4'; t.sched={t:'09:00',m:30}; }
        t.sched.date = dropDate;
      }
    });
    selectedIds.clear();
    closeDatePanel();

  } else {
    // ── Normal reorder ──────────────────────────────────────────────────────
    const subtreeSet=new Set(subtree.map(t=>t.id));
    const filtered=tasks.filter(t=>!subtreeSet.has(t.id));
    const delta=dropIndent-task.indent;
    subtree.forEach((t,i)=>{ t.indent=i===0?dropIndent:Math.max(0,t.indent+delta); });
    if (dropBeforeId===null) filtered.push(...subtree);
    else { const at=filtered.findIndex(t=>t.id===dropBeforeId); filtered.splice(at>=0?at:filtered.length,0,...subtree); }
    tasks=filtered;
    // drag reorder = manual from now on
    currentSort='manual';
    const sel=$('#sort-select'); if(sel) sel.value='manual';
  }

  $$('.task-row').forEach(r=>r.style.opacity='');
  drag=null;
  document.removeEventListener('pointermove',onDragMove);
  document.removeEventListener('pointerup',onDragUp);
  rerender();
}

// ── Zoom ──────────────────────────────────────────────────────────────────────
function applyZoom(newPPM, pivotClientY) {
  const oldPPM = ppm;
  const oldRenderStart = _renderStart;
  ppm = Math.max(PPM_MIN, Math.min(PPM_MAX, newPPM));
  updateTLH();

  // Update label: show scale relative to default
  const scale = ppm / 1.5;
  const lbl = Math.abs(scale - 1) < 0.03 ? '1×'
    : scale > 1 ? scale.toFixed(1)+'×'
    : '÷'+( 1/scale).toFixed(1);
  if ($('#zoom-label')) $('#zoom-label').textContent = lbl;

  // Compute scroll adjustment to keep the time under pivotClientY stationary
  let scrollDelta = 0;
  if (pivotClientY !== undefined) {
    const tlRect = $('#tl-panel').getBoundingClientRect();
    const yInPanel = pivotClientY - tlRect.top;
    const timeAtCursor = oldRenderStart + yInPanel / oldPPM;
    const newY = (timeAtCursor - _renderStart) * ppm;
    scrollDelta = newY - yInPanel;
  }

  rerender();
  if (scrollDelta) requestAnimationFrame(() => $('#card-body').scrollBy(0, scrollDelta));
}

// ── Sort ──────────────────────────────────────────────────────────────────────
let currentSort = 'time';

// Mutates tasks array in-place; does NOT rerender.
function applySort(type) {
  if (type === 'manual') return;
  const rootGroups = [];
  let i = 0;
  while (i < tasks.length) {
    const t = tasks[i];
    if (t.indent === 0) { const sub = getSubtree(t); rootGroups.push(sub); i += sub.length; }
    else { rootGroups.push([t]); i++; }
  }
  rootGroups.sort((a, b) => {
    const ta = a[0], tb = b[0];
    if (type === 'time') {
      const at = ta.sched?.t || '99:99';
      const bt = tb.sched?.t || '99:99';
      return at.localeCompare(bt);
    }
    if (type === 'date') {
      const ad = ta.sched?.date || (ta.sched?.t ? '0000-01-01' : '9999-99-99');
      const bd = tb.sched?.date || (tb.sched?.t ? '0000-01-01' : '9999-99-99');
      if (ad !== bd) return ad.localeCompare(bd);
      return (ta.sched?.t || '99:99').localeCompare(tb.sched?.t || '99:99');
    }
    if (type === 'name') return ta.text.localeCompare(tb.text, undefined, {sensitivity:'base'});
    if (type === 'status') {
      if (ta.done !== tb.done) return ta.done ? 1 : -1;
      return ta.text.localeCompare(tb.text, undefined, {sensitivity:'base'});
    }
    return 0;
  });
  tasks = rootGroups.flat();
}

function sortAndApply(type) {
  currentSort = type;
  const sel = $('#sort-select'); if (sel) sel.value = type;
  applySort(type);
  rerender();
}

// ── Persistence ───────────────────────────────────────────────────────────────
const STORAGE_KEY = 'habit-watcher-v1';

let _sbSaveTimer = null;
function saveToStorage() {
  const payload = { tasks, uid, hideCompleted, tlStart, tlEnd, projects, pUid, horizons, hUid, folders, fUid };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch(e) {}
  clearTimeout(_sbSaveTimer);
  _sbSaveTimer = setTimeout(async () => {
    const { data: { session } } = await _sb.auth.getSession();
    if (!session) return;
    const { error } = await _sb.from('user_data').upsert(
      { id: session.user.id, data: payload },
      { onConflict: 'id' }
    );
    if (error) console.error('Supabase save failed:', error);
  }, 1500);
}

function applyStorageData(data) {
  if (Array.isArray(data.tasks)) {
    tasks = data.tasks;
    tasks.forEach(t => { if (COLORS.includes(t.color)) t.color = null; });
  }
  if (typeof data.uid === 'number')            uid           = data.uid;
  if (typeof data.hideCompleted === 'boolean') hideCompleted = data.hideCompleted;
  if (typeof data.tlStart === 'number')        tlStart       = data.tlStart;
  if (typeof data.tlEnd   === 'number')        tlEnd         = data.tlEnd;
  if (Array.isArray(data.projects))            projects      = data.projects;
  if (typeof data.pUid === 'number')           pUid          = data.pUid;
  if (typeof data.hUid === 'number')           hUid          = data.hUid;
  if (Array.isArray(data.folders))             folders       = data.folders;
  if (typeof data.fUid === 'number')           fUid          = data.fUid;
  if (Array.isArray(data.horizons)) {
    horizons = data.horizons;
  } else if (data.horizons && typeof data.horizons === 'object') {
    let i = 1;
    horizons = Object.entries(data.horizons).map(([name, text]) => ({ id: i++, name, text }));
    hUid = Math.max(hUid, i);
  }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) applyStorageData(JSON.parse(raw));
  } catch(e) { console.warn('localStorage load failed', e); }
}

async function loadFromSupabase() {
  try {
    const { data } = await _sb.from('user_data').select('data').single();
    if (data?.data) {
      applyStorageData(data.data);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data.data)); } catch(e) {}
    } else {
      loadFromStorage(); // first login — migrate from localStorage
    }
  } catch(e) {
    console.warn('Supabase load failed, falling back to localStorage', e);
    loadFromStorage();
  }
}

// ── Rerender ──────────────────────────────────────────────────────────────────
function rerender() {
  saveToStorage();
  if (folderDrawerOpen) { drawerSubTab === 'folders' ? renderFolders($('#drawer-folders-list')) : renderDrawerProjects(); }
  if (currentTab === 'projects')  { projSubTab === 'folders' ? renderFolders() : renderProjects(); return; }
  if (currentTab === 'horizons')  { renderHorizons();  return; }
  if (currentTab === 'repeaters') { renderRepeaters(); return; }
  if (viewMode === 'week') { renderWeek(); renderTimeline(); return; }
  applySort(currentSort);
  updateHeader();
  renderTasks();
  requestAnimationFrame(()=>{
    renderTimeline();
    syncDatePanelHeight();
    requestAnimationFrame(drawConnections);
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
function populateTimeSelects() {
  const startSel=$('#tl-start-sel'), endSel=$('#tl-end-sel');
  if (!startSel || !endSel) return;
  const fmt = h => h===0?'12am':h<12?h+'am':h===12?'12pm':h===24?'midnight':(h-12)+'pm';
  for (let h=0;h<24;h++) {
    const os=document.createElement('option'); os.value=h*60; os.textContent=fmt(h); startSel.appendChild(os);
    const oe=document.createElement('option'); oe.value=h*60; oe.textContent=fmt(h); endSel.appendChild(oe);
  }
  const mid=document.createElement('option'); mid.value=24*60; mid.textContent='midnight'; endSel.appendChild(mid);
  startSel.value = tlStart; endSel.value = tlEnd;
  startSel.addEventListener('change', () => { const v=parseInt(startSel.value); if(v>=tlEnd-60) return (startSel.value=tlStart); tlStart=v; updateTLH(); rerender(); });
  endSel.addEventListener('change',   () => { const v=parseInt(endSel.value);   if(v<=tlStart+60) return (endSel.value=tlEnd);   tlEnd=v;   updateTLH(); rerender(); });
}

// ── Repeat modal ───────────────────────────────────────────────────────────────
let _repeatTask = null;

let _repeatDOM  = 1;
let _repeatTPW  = 1;

// ── Schedule modal ────────────────────────────────────────────────────────────
// ── Task context menu (mobile ⋯ button) ───────────────────────────────────────
let _taskMenuEl = null;
function closeTaskMenu() {
  if (_taskMenuEl) { _taskMenuEl.remove(); _taskMenuEl = null; }
  document.removeEventListener('pointerdown', _taskMenuOutside);
}
function _taskMenuOutside(e) {
  if (_taskMenuEl && !_taskMenuEl.contains(e.target)) closeTaskMenu();
}
function openTaskMenu(task, anchorEl) {
  closeTaskMenu();
  const menu = document.createElement('div');
  menu.className = 'task-ctx-menu';
  _taskMenuEl = menu;

  const items = [];
  if (!task.isHeader) {
    items.push({ label: task.sched?.t ? 'Edit schedule' : 'Set time', fn: () => openSchedModal(task) });
    items.push({ label: task.notes ? 'Edit notes' : 'Add notes', fn: () => openNotesModal(task, () => rerender()) });
    items.push({ label: task.repeat ? 'Edit repeat' : 'Set repeat', fn: () => openRepeatModal(task) });
    if (task.sched?.t) items.push({ label: 'Remove time', fn: () => unscheduleTask(task) });
  }
  items.push({ label: 'Delete', fn: () => {
    const sub = getSubtree(task);
    tasks = tasks.filter(t => !sub.includes(t));
    saveToStorage(); rerender();
  }, danger: true });

  items.forEach(({ label, fn, danger }) => {
    const btn = document.createElement('button');
    btn.className = 'task-ctx-item' + (danger ? ' ctx-danger' : '');
    btn.textContent = label;
    btn.addEventListener('pointerdown', e => { e.stopPropagation(); closeTaskMenu(); fn(); });
    menu.appendChild(btn);
  });

  document.body.appendChild(menu);

  // Position below anchor, right-aligned, clamped to viewport
  const r = anchorEl.getBoundingClientRect();
  const mW = 172;
  let left = r.right - mW;
  if (left < 6) left = 6;
  let top = r.bottom + 6;
  if (top + 280 > window.innerHeight) top = r.top - Math.min(280, top + 280 - window.innerHeight) - 6;
  menu.style.left = left + 'px';
  menu.style.top  = top + 'px';

  setTimeout(() => document.addEventListener('pointerdown', _taskMenuOutside), 50);
}

function openRepeatModal(task) {

  _repeatDay  = r?.day  ?? ((new Date().getDay() + 6) % 7);

    if (!_repeatTask.sched) _repeatTask.sched = { date: todayStr() };

// ── Move between schedule and projects ────────────────────────────────────────
function showMovePicker(anchor, onSelectProj, onSelectFolder) {
  $$('.project-picker').forEach(p => p.remove());
  const picker = document.createElement('div'); picker.className = 'project-picker';
  if (projects.length === 0 && folders.length === 0) {
    const msg = document.createElement('div'); msg.className = 'project-picker-empty';
    msg.textContent = 'No projects or folders yet'; picker.appendChild(msg);
  } else {
    if (projects.length) {
      const hdr = document.createElement('div'); hdr.className = 'project-picker-section'; hdr.textContent = 'Projects'; picker.appendChild(hdr);
      for (const proj of projects) {
        const item = document.createElement('div'); item.className = 'project-picker-item';
        item.textContent = proj.name;
        item.addEventListener('mousedown', e => { e.stopPropagation(); picker.remove(); onSelectProj(proj); });
        picker.appendChild(item);
      }
    }
    if (folders.length) {
      if (projects.length) { const sep = document.createElement('div'); sep.className = 'project-picker-sep'; picker.appendChild(sep); }
      const hdr = document.createElement('div'); hdr.className = 'project-picker-section'; hdr.textContent = 'Folders'; picker.appendChild(hdr);
      for (const folder of folders) {
        const item = document.createElement('div'); item.className = 'project-picker-item';
        item.textContent = folder.name;
        item.addEventListener('mousedown', e => { e.stopPropagation(); picker.remove(); onSelectFolder(folder); });
        picker.appendChild(item);
      }
    }
  }
  document.body.appendChild(picker);
  const r = anchor.getBoundingClientRect();
  picker.style.top  = Math.min(r.bottom + 4, window.innerHeight - picker.offsetHeight - 8) + 'px';
  picker.style.left = Math.min(r.left, window.innerWidth - 170) + 'px';
  const close = e => { if (!picker.contains(e.target)) { picker.remove(); document.removeEventListener('mousedown', close); } };
  setTimeout(() => document.addEventListener('mousedown', close), 10);
}

function moveTaskToProject(task, proj) {
  tasks = tasks.filter(t => t.id !== task.id);
  proj.tasks.push({ id: ++pUid, text: task.text, done: task.done,
    indent: task.indent, notes: task.notes || '' });
  saveToStorage(); rerender();
}

function moveTaskToFolder(task, folder) {
  task.folderId = folder.id;
  // Task stays in tasks[]; if unscheduled it now only shows in the folder.
  // If it has a sched it remains on the schedule until done/cancelled.
  saveToStorage(); rerender();
}

function moveProjectTaskToSchedule(proj, pt) {
  proj.tasks = proj.tasks.filter(t => t.id !== pt.id);
  tasks.push({ id: ++uid, text: pt.text, isHeader: false, done: pt.done,

// ── Project task drag: drop on timeline or date panel ─────────────────────────
function setupProjectTaskDrag(handle, row, proj, pt) {
  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging-active');
    const rowR = row.getBoundingClientRect();
    const offX = e.clientX - rowR.left, offY = e.clientY - rowR.top;

    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.style.cssText = `width:${rowR.width}px;left:${rowR.left}px;top:${rowR.top}px;`;
    const gTxt = document.createElement('div');
    gTxt.style.cssText = 'flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;';
    gTxt.textContent = pt.text;
    ghost.append(gTxt);
    document.body.appendChild(ghost);
    row.style.opacity = '0.3';

    let projTlPreview = null, projTlDropTime = null, projDropDate = null, projOverCal = false;
    drag = { projDrag: true }; // blocks day-cell browse clicks

    function onMove(e) {
      ghost.style.left = (e.clientX - offX) + 'px';
      ghost.style.top  = (e.clientY - offY) + 'px';

      const tlRect = $('#tl-panel').getBoundingClientRect();
      const tpRect = $('#task-panel').getBoundingClientRect();

      // ── Over timeline → snap to time ───────────────────────────────────
      if (e.clientX >= tlRect.left && e.clientX <= tlRect.right) {
        projDropDate = null; projOverCal = false;
        $$('.week-col.week-drag-over').forEach(c => c.classList.remove('week-drag-over'));
        const relY = e.clientY - tlRect.top;
        const snapMins = Math.max(_renderStart, Math.min(tlEnd - 15,
          Math.round(yToMins(Math.max(0, relY)) / 5) * 5));
        projTlDropTime = minsToTime(snapMins);
        const snapY = minsToY(snapMins);
        if (!projTlPreview) {
          projTlPreview = document.createElement('div');
          projTlPreview.className = 'tl-bar preview';
          $('#tl-panel').appendChild(projTlPreview);
        }
        projTlPreview.style.top    = snapY + 'px';
        projTlPreview.style.height = (minsToY(snapMins + 30) - snapY) + 'px';
        projTlPreview.style.background = '#4f46e5';
        $$('.day-cell.drag-over').forEach(d => d.classList.remove('drag-over'));
        showTip(projTlDropTime, e.clientX, e.clientY);
        return;
      }

      if (projTlPreview) { projTlPreview.remove(); projTlPreview = null; }
      projTlDropTime = null;

      // ── Cal button → highlight ─────────────────────────────────────────
      const calBtn2 = $('#btn-cal-toggle');
      const calR2 = calBtn2.getBoundingClientRect();
      const overCal2 = e.clientX>=calR2.left&&e.clientX<=calR2.right&&e.clientY>=calR2.top&&e.clientY<=calR2.bottom;
      calBtn2.classList.toggle('drag-over-cal', overCal2);
      projOverCal = overCal2;
      ghost.style.opacity = overCal2 ? '0.4' : '0.93';
      hideTip();

      // ── Week column or task panel → date-only ──────────────────────────
      $$('.week-col.week-drag-over').forEach(c => c.classList.remove('week-drag-over'));
      projDropDate = null;
      if (!overCal2) {
        for (const col of $$('.week-col')) {
          const r = col.getBoundingClientRect();
          if (e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) {
            col.classList.add('week-drag-over'); projDropDate = col.dataset.date;
            ghost.style.opacity = '0.7'; break;
          }
        }
        if (!projDropDate) {
          const tp = $('#task-panel');
          if (tp && tp.offsetParent !== null) {
            const r = tp.getBoundingClientRect();
            if (e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) {
              projDropDate = viewDate || todayStr(); ghost.style.opacity = '0.7';
            }
          }
        }
      }
    }

    function onUp(e) {
      document.body.classList.remove('dragging-active');
      ghost.remove(); row.style.opacity = '';
      if (projTlPreview) { projTlPreview.remove(); projTlPreview = null; }
      $$('.day-cell.drag-over').forEach(d => d.classList.remove('drag-over'));
      $$('.week-col.week-drag-over').forEach(c => c.classList.remove('week-drag-over'));
      $('#btn-cal-toggle').classList.remove('drag-over-cal');
      hideTip(); hideMiniGhost();
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      drag = null;

      if (projOverCal) {
        // ── Dropped on cal button → move task to schedule, open date picker ─
        proj.tasks = proj.tasks.filter(t => t.id !== pt.id);
        const newTask = {
          id: ++uid, text: pt.text, isHeader: false, done: pt.done,
          indent: pt.indent, color: null, sched: null, notes: pt.notes || ''
        };
        tasks.push(newTask);
        saveToStorage();
        switchTab('schedule');
        datePanelTarget = newTask;
        openDatePanel($('#btn-cal-toggle'));
        return;
      }

      if (projTlDropTime || projDropDate) {
        proj.tasks = proj.tasks.filter(t => t.id !== pt.id);
        const color = projTlDropTime ? '#9898b4' : null;
        const schedDate = projTlDropTime
          ? (viewDate && viewDate !== todayStr() ? viewDate : null)
          : projDropDate;
        const newSched = projTlDropTime
          ? { t: projTlDropTime, m: 30, ...(schedDate ? { date: schedDate } : {}) }
          : { date: projDropDate };
        const newTask = {
          id: ++uid, text: pt.text, isHeader: false, done: pt.done,
          indent: pt.indent, color, sched: newSched, notes: pt.notes || ''
        };
        tasks.push(newTask);
        if (projDropDate) closeDatePanel();
        saveToStorage();
        switchTab('schedule');
        // Let user drag-resize duration after dropping on timeline
        if (projTlDropTime) {
          const dropY = e.clientY;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            const bar = $(`.tl-bar[data-id="${newTask.id}"]`) ||
                        $(`.tl-tick-event[data-id="${newTask.id}"]`);
            if (bar) startBottomResize(bar, newTask, dropY, 0);
          }));
        }
      }
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}
