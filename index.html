// ── Folders render ─────────────────────────────────────────────────────────────
function renderFolders(container) {
  const isMaster = !container;
  container = container || $('#folders-list');
  container.innerHTML = '';
  if (folders.length === 0) {
    container.innerHTML = '<div class="empty-projects">No folders yet.<br>Click <strong>+ New Folder</strong> to get started.</div>';
    if (isMaster && folderDrawerOpen) renderFolders($('#drawer-folders-list'));
    return;
  }
  for (const folder of folders) {
    const block = document.createElement('div');
    block.className = 'folder-block'; block.dataset.fid = folder.id;

    const head = document.createElement('div'); head.className = 'folder-head';
    const chev = document.createElement('span'); chev.className = 'folder-chevron';
    chev.textContent = folder.collapsed ? '▸' : '▾';
    chev.addEventListener('click', () => { folder.collapsed = !folder.collapsed; saveToStorage(); renderFolders(); });
    const icon = document.createElement('span'); icon.className = 'folder-icon'; icon.textContent = '▤';
    const nameEl = document.createElement('div');
    nameEl.className = 'folder-name'; nameEl.contentEditable = 'true'; nameEl.spellcheck = false;
    nameEl.textContent = folder.name;
    nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); } });
    nameEl.addEventListener('blur', () => { const v = nameEl.textContent.trim(); if (v) { folder.name = v; saveToStorage(); } });
    const delBtn = document.createElement('button'); delBtn.className = 'folder-del'; delBtn.textContent = '×';
    delBtn.title = 'Delete folder';
    delBtn.addEventListener('click', () => {
      const count = tasks.filter(t => t.folderId === folder.id).length;
      if (count === 0 || confirm(`Delete "${folder.name}" and its ${count} task(s)?`)) {
        tasks = tasks.filter(t => t.folderId !== folder.id);
        folders = folders.filter(f => f.id !== folder.id);
        saveToStorage(); renderFolders();
      }
    });
    head.append(chev, icon, nameEl, delBtn);
    block.appendChild(head);

    if (!folder.collapsed) {
      const folderTasks = tasks.filter(t => t.folderId === folder.id);
      const taskList = document.createElement('div'); taskList.className = 'folder-tasks';

      folderTasks.forEach((ft) => {
        if (hideCompleted && ft.done) return;
        const row = document.createElement('div');
        row.className = 'ftask-row' + (ft.isHeader ? ' is-group' : '');
        row.style.paddingLeft = (8 + ft.indent * INDENT_W) + 'px';

        if (ft.isHeader) {
          const txt = document.createElement('div'); txt.className = 'ftask-group-text';
          txt.contentEditable = 'true'; txt.spellcheck = false; txt.textContent = ft.text;
          txt.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); txt.blur(); } });
          txt.addEventListener('blur', () => { ft.text = txt.textContent.trim() || ft.text; saveToStorage(); });
          const del = document.createElement('button'); del.className = 'ptask-del'; del.textContent = '×';
          del.addEventListener('click', () => { tasks = tasks.filter(t => t.id !== ft.id); saveToStorage(); renderFolders(); });
          row.append(txt, del);
        } else {
          const ftHandle = document.createElement('div'); ftHandle.className = 'drag-handle'; ftHandle.innerHTML = '⠿';
          setupFolderTaskDrag(ftHandle, ft);
          const chk = document.createElement('div'); chk.className = 'pill-chk' + (ft.done ? ' done' : '');
          chk.addEventListener('click', () => { ft.done = !ft.done; saveToStorage(); renderFolders(); });
          const txt = document.createElement('div'); txt.className = 'ptask-text' + (ft.done ? ' done' : '');
          txt.contentEditable = 'true'; txt.spellcheck = false; txt.textContent = ft.text;
          txt.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); txt.blur(); } });
          txt.addEventListener('blur', () => { ft.text = txt.textContent.trim() || ft.text; saveToStorage(); });
          row.appendChild(ftHandle);

          // Schedule badge or button
          if (ft.sched) {
            const label = ft.sched.t ? ft.sched.t : (ft.sched.date || '').slice(5);
            const badge = document.createElement('span'); badge.className = 'ftask-sched-badge';
            badge.textContent = label; badge.title = 'Click to unschedule';
            badge.addEventListener('click', e => {
              e.stopPropagation();
              ft.sched = null; saveToStorage(); renderFolders();
            });
            row.append(chk, txt, badge);
          } else {
            const schedBtn = document.createElement('span'); schedBtn.className = 'ftask-sched-badge';
            schedBtn.textContent = '+ date'; schedBtn.style.opacity = '0';
            schedBtn.style.transition = 'opacity .12s';
            row.addEventListener('mouseenter', () => schedBtn.style.opacity = '1');
            row.addEventListener('mouseleave', () => schedBtn.style.opacity = '0');
            schedBtn.addEventListener('click', e => {
              e.stopPropagation();
              datePanelTarget = ft;
              openDatePanel($('#btn-cal-toggle'));
            });
            row.append(chk, txt, schedBtn);
          }

          const notesBtn = document.createElement('button');
          notesBtn.className = 'notes-btn' + (ft.notes ? ' has-notes' : '');
          notesBtn.title = ft.notes ? 'Edit notes' : 'Add notes'; notesBtn.textContent = '✎';
          notesBtn.addEventListener('click', e => {
            e.stopPropagation();
            openNotesModal(ft, () => { saveToStorage(); renderFolders(); });
          });
          const del = document.createElement('button'); del.className = 'ptask-del'; del.textContent = '×';
          del.addEventListener('click', () => { tasks = tasks.filter(t => t.id !== ft.id); saveToStorage(); renderFolders(); });
          row.append(notesBtn, del);
        }
        taskList.appendChild(row);
      });

      const btnRow = document.createElement('div'); btnRow.style.cssText = 'display:flex;gap:4px;padding:2px 8px 6px';
      const addTask = document.createElement('button'); addTask.className = 'btn-add-ptask'; addTask.textContent = '+ task';
      addTask.addEventListener('click', () => {
        tasks.push({ id: ++uid, text: '', isHeader: false, done: false, indent: 0, color: null, sched: null, notes: '', folderId: folder.id });
        saveToStorage(); renderFolders();
        setTimeout(() => {
          const rows = $$(`.folder-block[data-fid="${folder.id}"] .ptask-text`);
          const last = rows[rows.length - 1]; if (last) last.focus();
        }, 30);
      });
      const addGroup = document.createElement('button'); addGroup.className = 'btn-add-ptask'; addGroup.textContent = '+ group';
      addGroup.addEventListener('click', () => {
        tasks.push({ id: ++uid, text: 'Group', isHeader: true, done: false, indent: 0, color: null, sched: null, notes: '', folderId: folder.id });
        saveToStorage(); renderFolders();
        setTimeout(() => {
          const rows = $$(`.folder-block[data-fid="${folder.id}"] .ftask-group-text`);
          const last = rows[rows.length - 1];
          if (last) { last.focus(); document.execCommand('selectAll', false, null); }
        }, 30);
      });
      btnRow.append(addTask, addGroup);
      block.append(taskList, btnRow);
    }
    container.appendChild(block);
  }
  if (isMaster && folderDrawerOpen) renderFolders($('#drawer-folders-list'));
}

// ── Projects render ────────────────────────────────────────────────────────────
function makeProjectBlock(proj) {
  const block = document.createElement('div');
  block.className = 'project-block' + (proj.inactive ? ' inactive' : '');
  block.dataset.pid = proj.id;

  // ── Project header ──
  const head = document.createElement('div'); head.className = 'project-head';
  const chev = document.createElement('span'); chev.className = 'project-chevron';
  chev.textContent = proj.collapsed ? '▸' : '▾';
  chev.addEventListener('click', () => { proj.collapsed = !proj.collapsed; saveToStorage(); renderProjects(); });
  const nameEl = document.createElement('div');
  nameEl.className = 'project-name'; nameEl.contentEditable = 'true'; nameEl.spellcheck = false;
  nameEl.textContent = proj.name;
  nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); } });
  nameEl.addEventListener('blur', () => { const v = nameEl.textContent.trim(); if (v) { proj.name = v; saveToStorage(); } });

  // Pause / resume button
  const pauseBtn = document.createElement('button');
  pauseBtn.className = 'project-pause';
  pauseBtn.title = proj.inactive ? 'Make active' : 'Make inactive';
  pauseBtn.innerHTML = proj.inactive
    ? `<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`
    : `<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
  pauseBtn.addEventListener('click', e => {
    e.stopPropagation();
    proj.inactive = !proj.inactive;
    saveToStorage(); renderProjects();
  });

  const delProj = document.createElement('button'); delProj.className = 'project-del'; delProj.textContent = '×';
  delProj.title = 'Delete project';
  delProj.addEventListener('click', () => {
    if (proj.tasks.length === 0 || confirm(`Delete "${proj.name}" and all its tasks?`)) {
      projects = projects.filter(p => p.id !== proj.id); saveToStorage(); renderProjects();
    }
  });
  head.append(chev, nameEl, pauseBtn, delProj);
  block.appendChild(head);
  return block;
}

function renderProjects() {
  const container = $('#projects-list');
  container.innerHTML = '';
  if (projects.length === 0) {
    container.innerHTML = '<div class="empty-projects">No projects yet.<br>Click <strong>+ New Project</strong> to get started.</div>';
    return;
  }
  const active   = projects.filter(p => !p.inactive);
  const inactive = projects.filter(p =>  p.inactive);
  for (const proj of active) {
    const block = makeProjectBlock(proj);

    if (!proj.collapsed) {
      const taskList = document.createElement('div'); taskList.className = 'project-tasks';
      for (let i = 0; i < proj.tasks.length; i++) {
        const pt = proj.tasks[i];
        if (hideCompleted && pt.done) continue;
        const row = document.createElement('div'); row.className = 'ptask-row';
        row.style.paddingLeft = (12 + pt.indent * INDENT_W) + 'px';
        const chk = document.createElement('div');
        chk.className = 'pill-chk' + (pt.done ? ' done' : '');
        chk.addEventListener('click', () => { pt.done = !pt.done; saveToStorage(); renderProjects(); });
        const txt = document.createElement('div');
        txt.className = 'ptask-text' + (pt.done ? ' done' : '');
        txt.contentEditable = 'true'; txt.spellcheck = false; txt.textContent = pt.text;
        txt.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault(); txt.blur();
            const next = { id: ++pUid, text: '', done: false, indent: pt.indent, notes: '' };
            proj.tasks.splice(i + 1, 0, next); saveToStorage(); renderProjects();
            setTimeout(() => {
              const rows = $$(`.project-block[data-pid="${proj.id}"] .ptask-text`);
              if (rows[i + 1]) rows[i + 1].focus();
            }, 30);
          }
          if (e.key === 'Tab') {
            e.preventDefault();
            const prevPt = proj.tasks[i - 1];
            const maxPI = prevPt ? prevPt.indent + 1 : 0;
            pt.indent = e.shiftKey ? Math.max(0, pt.indent - 1) : Math.min(maxPI, pt.indent + 1);
            saveToStorage(); renderProjects();
            setTimeout(() => {
              const rows = $$(`.project-block[data-pid="${proj.id}"] .ptask-text`);
              if (rows[i]) { rows[i].focus(); placeCaretAtEnd(rows[i]); }
            }, 30);
          }
          if (e.key === 'Backspace' && !txt.textContent) {
            e.preventDefault();
            if (proj.tasks.length > 1) {
              proj.tasks.splice(i, 1); saveToStorage(); renderProjects();
              setTimeout(() => {
                const rows = $$(`.project-block[data-pid="${proj.id}"] .ptask-text`);
                const prev = rows[Math.max(0, i - 1)];
                if (prev) { prev.focus(); placeCaretAtEnd(prev); }
              }, 30);
            }
          }
          if (e.key === 'Escape') txt.blur();
        });
        txt.addEventListener('blur', () => { pt.text = txt.textContent.trim() || pt.text; saveToStorage(); });
        const notesBtn = document.createElement('button');
        notesBtn.className = 'notes-btn' + (pt.notes ? ' has-notes' : '');
        notesBtn.title = pt.notes ? 'Edit notes' : 'Add notes'; notesBtn.textContent = '✎';
        notesBtn.addEventListener('click', e => {
          e.stopPropagation();
          openNotesModal(pt, () => { saveToStorage(); renderProjects(); });
        });
        const moveSchedBtn = document.createElement('button');
        moveSchedBtn.className = 'move-btn'; moveSchedBtn.title = 'Move to schedule';
        moveSchedBtn.textContent = '→ sched';
        moveSchedBtn.addEventListener('click', e => { e.stopPropagation(); moveProjectTaskToSchedule(proj, pt); });
        const del = document.createElement('button'); del.className = 'ptask-del'; del.textContent = '×';
        del.addEventListener('click', () => { proj.tasks.splice(i, 1); saveToStorage(); renderProjects(); });
        const ptHandle = document.createElement('div');
        ptHandle.className = 'drag-handle'; ptHandle.innerHTML = '⠿';
        setupProjectTaskDrag(ptHandle, row, proj, pt);
        row.append(ptHandle, chk, txt, notesBtn, moveSchedBtn, del);
        taskList.appendChild(row);
      }
      const addBtn = document.createElement('button'); addBtn.className = 'btn-add-ptask';
      addBtn.textContent = '+ Add task';
      addBtn.addEventListener('click', () => {
        proj.tasks.push({ id: ++pUid, text: 'New task', done: false, indent: 0, notes: '' });
        saveToStorage(); renderProjects();
        setTimeout(() => {
          const rows = $$(`.project-block[data-pid="${proj.id}"] .ptask-text`);
          const last = rows[rows.length - 1];
          if (last) { last.focus(); document.execCommand('selectAll', false, null); }
        }, 40);
      });
      block.append(taskList, addBtn);
    }
    container.appendChild(block);
  }

  // ── Inactive section ──
  if (inactive.length > 0) {
    const sep = document.createElement('div'); sep.className = 'projects-inactive-sep';
    sep.textContent = 'Inactive';
    container.appendChild(sep);
    for (const proj of inactive) {
      const iblock = makeProjectBlock(proj);
      // Inactive projects show collapsed by default; still expandable
      if (!proj.collapsed) {
        const tl = document.createElement('div'); tl.className = 'project-tasks';
        proj.tasks.forEach(pt => {
          if (hideCompleted && pt.done) return;
          const row = document.createElement('div'); row.className = 'ptask-row';
          row.style.paddingLeft = (12 + pt.indent * INDENT_W) + 'px';
          const chk = document.createElement('div'); chk.className = 'pill-chk' + (pt.done ? ' done' : '');
          const txt = document.createElement('div'); txt.className = 'ptask-text' + (pt.done ? ' done' : '');
          txt.textContent = pt.text;
          row.append(chk, txt);
          tl.appendChild(row);
        });
        iblock.appendChild(tl);
      }
      container.appendChild(iblock);
    }
  }
}

// ── Schedule a manual repeater instance ──────────────────────────────────────
function scheduleRepeaterInstance(template) {
  const newTask = {
    id: ++uid, text: template.text, isHeader: false, done: false,
    indent: 0, color: template.color || '#9898b4', sched: null,
    notes: '', repeatTemplateId: template.id
  };
  tasks.push(newTask);
  saveToStorage();
  switchTab('schedule');
  setTimeout(() => {
    const el = $(`.pill[data-id="${newTask.id}"] .pill-text`); if (el) el.focus();
  }, 60);
}

// ── Add a new repeater task ────────────────────────────────────────────────────
function addNewRepeater() {
  const newTask = {
    id: ++uid, text: 'New repeater', isHeader: false, done: false,
    indent: 0, color: null, sched: { date: todayStr() }, notes: ''
  };
  tasks.push(newTask);
  saveToStorage();
  openRepeatModal(newTask);
  // After modal closes + repeat set, rerender() runs renderRepeaters() automatically
}

// ── Repeaters render ───────────────────────────────────────────────────────────
function renderRepeaters() {
  const panel = $('#repeaters-panel');
  panel.innerHTML = '';

  const allRepeaters = tasks.filter(t => t.repeat && !t.isHeader);
  const manual = allRepeaters.filter(t => t.repeat.freq === 'manual');
  const auto   = allRepeaters.filter(t => t.repeat.freq !== 'manual');

  const DAY_ABB = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function makeNameEl(t) {
    const name = document.createElement('div'); name.className = 'rep-name';
    name.contentEditable = 'true'; name.spellcheck = false;
    name.textContent = t.text; name.title = t.text;
    name.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); name.blur(); } });
    name.addEventListener('blur', () => {
      const v = name.textContent.trim(); if (v) { t.text = v; saveToStorage(); }
    });
    return name;
  }

  function makeDelBtn(t) {
    const btn = document.createElement('button'); btn.className = 'rep-del';
    btn.textContent = '×'; btn.title = 'Remove repeat';
    btn.addEventListener('click', () => { t.repeat = null; saveToStorage(); renderRepeaters(); });
    return btn;
  }

  // ── Manual section ──
  if (manual.length > 0) {
    const sec = document.createElement('div'); sec.className = 'rep-section';
    const shead = document.createElement('div'); shead.className = 'rep-section-head';
    shead.textContent = 'Manual — schedule each instance yourself';
    sec.appendChild(shead);

    for (const t of manual) {
      const needed = t.repeat.timesPerWeek || 1;
      const done   = countManualInstancesThisWeek(t.id);
      const met    = done >= needed;

      const row = document.createElement('div'); row.className = 'rep-row';
      const badge = document.createElement('span'); badge.className = 'rep-badge manual';
      badge.textContent = `${needed}×/wk`;
      const status = document.createElement('span');
      status.className = 'rep-status' + (met ? ' met' : '');
      status.textContent = `${done} / ${needed} this week`;
      const editBtn = document.createElement('button'); editBtn.className = 'rep-edit-btn';
      editBtn.textContent = '↻'; editBtn.title = 'Edit repeat settings';
      editBtn.addEventListener('click', e => { e.stopPropagation(); openRepeatModal(t); });
      const schedBtn = document.createElement('button'); schedBtn.className = 'rep-sched-btn';
      schedBtn.textContent = '+ Schedule';
      schedBtn.addEventListener('click', () => scheduleRepeaterInstance(t));
      row.append(badge, makeNameEl(t), status, editBtn, schedBtn, makeDelBtn(t));
      sec.appendChild(row);
    }
    panel.appendChild(sec);
  }

  // ── Automatic section ──
  if (auto.length > 0) {
    const sec = document.createElement('div'); sec.className = 'rep-section';
    const shead = document.createElement('div'); shead.className = 'rep-section-head';
    shead.textContent = 'Automatic';
    sec.appendChild(shead);

    for (const t of auto) {
      const freq = t.repeat.freq;
      const labelText = freq === 'daily' ? '↻ daily'
        : freq === 'weekly' ? `↻ ${DAY_ABB[t.repeat.day] || '?'}`
        : `↻ ${t.repeat.dayOfMonth}th`;

      const row = document.createElement('div'); row.className = 'rep-row';
      const badge = document.createElement('span'); badge.className = 'rep-badge';
      badge.textContent = labelText;
      const editBtn = document.createElement('button'); editBtn.className = 'rep-edit-btn';
      editBtn.textContent = '↻'; editBtn.title = 'Edit repeat settings';
      editBtn.addEventListener('click', e => { e.stopPropagation(); openRepeatModal(t); });
      row.append(badge, makeNameEl(t), editBtn, makeDelBtn(t));
      sec.appendChild(row);
    }
    panel.appendChild(sec);
  }

  if (allRepeaters.length === 0) {
    const empty = document.createElement('div'); empty.className = 'rep-empty';
    empty.innerHTML = 'No repeating tasks yet.<br>Click <strong>+ New Repeater</strong> below to add one.';
    panel.appendChild(empty);
  }

  // "+ New Repeater" button
  const addBtn = document.createElement('button'); addBtn.className = 'btn-add-repeater';
  addBtn.textContent = '+ New Repeater';
  addBtn.addEventListener('click', addNewRepeater);
  panel.appendChild(addBtn);
}

// ── Horizons render ────────────────────────────────────────────────────────────
function renderHorizons() {
  const panel = $('#horizons-panel');
  panel.innerHTML = '';
  let dragSrcIdx = null;

  horizons.forEach((h, i) => {
    const section = document.createElement('div'); section.className = 'horizon-section';
    section.draggable = true;

    // Drag events
    section.addEventListener('dragstart', e => {
      dragSrcIdx = i;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => section.style.opacity = '0.4', 0);
    });
    section.addEventListener('dragend', () => {
      section.style.opacity = '';
      $$('.horizon-section').forEach(s => s.classList.remove('h-drag-over-top', 'h-drag-over-bottom'));
    });
    section.addEventListener('dragover', e => {
      if (dragSrcIdx === null || dragSrcIdx === i) return;
      e.preventDefault();
      const r = section.getBoundingClientRect();
      const isTop = e.clientY < r.top + r.height / 2;
      $$('.horizon-section').forEach(s => s.classList.remove('h-drag-over-top', 'h-drag-over-bottom'));
      section.classList.add(isTop ? 'h-drag-over-top' : 'h-drag-over-bottom');
    });
    section.addEventListener('dragleave', e => {
      if (!section.contains(e.relatedTarget)) section.classList.remove('h-drag-over-top', 'h-drag-over-bottom');
    });
    section.addEventListener('drop', e => {
      e.preventDefault();
      $$('.horizon-section').forEach(s => s.classList.remove('h-drag-over-top', 'h-drag-over-bottom'));
      if (dragSrcIdx === null || dragSrcIdx === i) return;
      const r = section.getBoundingClientRect();
      const isTop = e.clientY < r.top + r.height / 2;
      const [moved] = horizons.splice(dragSrcIdx, 1);
      let insertAt = i > dragSrcIdx ? i - 1 : i;
      if (!isTop) insertAt++;
      horizons.splice(insertAt, 0, moved);
      dragSrcIdx = null;
      saveToStorage(); renderHorizons();
    });

    const head = document.createElement('div'); head.className = 'horizon-head';
    const handle = document.createElement('span'); handle.className = 'horizon-drag-handle'; handle.textContent = '⠿';
    // Prevent drag from starting when clicking the name/delete
    handle.addEventListener('mousedown', e => e.stopPropagation());
    section.addEventListener('mousedown', e => {
      if (!e.target.closest('.horizon-drag-handle')) section.draggable = false;
    });
    section.addEventListener('mouseup', () => { section.draggable = true; });
    // Editable name
    const nameEl = document.createElement('div');
    nameEl.className = 'horizon-name-edit'; nameEl.contentEditable = 'true';
    nameEl.spellcheck = false; nameEl.textContent = h.name;
    nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); } });
    nameEl.addEventListener('blur', () => {
      const v = nameEl.textContent.trim(); if (v) { h.name = v; saveToStorage(); }
    });
    // Delete button
    const delBtn = document.createElement('button'); delBtn.className = 'horizon-del-btn';
    delBtn.textContent = '×'; delBtn.title = 'Delete this horizon';
    delBtn.addEventListener('click', () => {
      horizons.splice(i, 1); saveToStorage(); renderHorizons();
    });
    head.append(handle, nameEl, delBtn);

    const ta = document.createElement('textarea'); ta.className = 'horizon-ta';
    ta.placeholder = `Planning notes for ${h.name}…`;
    ta.value = h.text || '';
    ta.addEventListener('input', () => { h.text = ta.value; });
    ta.addEventListener('blur',  () => { h.text = ta.value; saveToStorage(); });

    section.append(head, ta);
    if (i < horizons.length - 1) {
      const div = document.createElement('div'); div.className = 'horizon-divider';
      section.appendChild(div);
    }
    panel.appendChild(section);
  });

  // "+ Add Horizon" button
  const addBtn = document.createElement('button'); addBtn.className = 'btn-add-horizon';
  addBtn.textContent = '+ Add Horizon';
  addBtn.addEventListener('click', () => {
    horizons.push({ id: hUid++, name: 'New Horizon', text: '' });
    saveToStorage(); renderHorizons();
    // Focus the new name for immediate editing
    setTimeout(() => {
      const all = $$('.horizon-name-edit');
      const last = all[all.length - 1];
      if (last) { last.focus(); document.execCommand('selectAll', false, null); }
    }, 30);
  });
  panel.appendChild(addBtn);
}

// ── Tab switching ──────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.body.classList.toggle('tab-projects',  tab === 'projects');
  document.body.classList.toggle('tab-horizons',  tab === 'horizons');
  document.body.classList.toggle('tab-repeaters', tab === 'repeaters');
  $('#schedule-panel').style.display  = tab === 'schedule'  ? ''     : 'none';
  $('#projects-panel').style.display  = tab === 'projects'  ? 'flex' : 'none';
  $('#horizons-panel').style.display  = tab === 'horizons'  ? 'flex' : 'none';
  $('#repeaters-panel').style.display = tab === 'repeaters' ? 'flex' : 'none';
  if (tab !== 'schedule') {
    $('#task-panel').style.display = '';
    $('#week-panel').style.display = 'none';
  } else {
    const isWeek = viewMode === 'week';
    $('#task-panel').style.display = isWeek ? 'none' : '';
    $('#week-panel').style.display = isWeek ? '' : 'none';
  }
  updateHeader();
  if (tab === 'projects') {
    renderProjects();
    updateTLH();
    renderTimeline();
  } else if (tab === 'horizons') {
    renderHorizons();
  } else if (tab === 'repeaters') {
    renderRepeaters();
  } else {
    rerender();
  }
}

// ── Add task modal ─────────────────────────────────────────────────────────────
let _modalIsGroup = false;
function _setModalType(isGroup) {
  _modalIsGroup = isGroup;
  $('#modal-type-task').classList.toggle('active', !isGroup);
  $('#modal-type-group').classList.toggle('active', isGroup);
  $('#modal-sched-row').style.display = isGroup ? 'none' : '';
}
function openAddModal(dateHint) {
  $('#modal-text').value = '';
  $('#modal-time').value = '';
  $('#modal-dur-h').value = '';
  $('#modal-dur-m').value = '';
  $('#modal-dur-field').style.display = 'none';
  $('#modal-date').value = dateHint || viewDate || '';
  const locSel = $('#modal-location-sel');
  locSel.innerHTML = '<option value="">— none —</option>';
  if (projects.length) {
    const pg = document.createElement('optgroup'); pg.label = 'Projects';
    projects.forEach(p => { const o = document.createElement('option'); o.value='p:'+p.id; o.textContent=p.name; pg.appendChild(o); });
    locSel.appendChild(pg);
  }
  if (folders.length) {
    const fg = document.createElement('optgroup'); fg.label = 'Folders';
    folders.forEach(f => { const o = document.createElement('option'); o.value='f:'+f.id; o.textContent=f.name; fg.appendChild(o); });
    locSel.appendChild(fg);
  }
  $('#modal-location-row').style.display = (projects.length || folders.length) ? '' : 'none';
  locSel.value = '';
  _setModalType(false);
  $('#add-modal').style.display = 'flex';
  setTimeout(() => $('#modal-text').focus(), 30);
}
function closeAddModal() {
  $('#add-modal').style.display = 'none';
}
function submitAddModal() {
  const text = $('#modal-text').value.trim();
  if (!text) { $('#modal-text').focus(); return; }
  const locVal = $('#modal-location-sel').value;
  if (locVal.startsWith('p:')) {
    const proj = projects.find(p => p.id === parseInt(locVal.slice(2)));
    if (proj) { proj.tasks.push({ id: ++pUid, text, done: false, indent: 0, notes: '', isHeader: _modalIsGroup }); closeAddModal(); saveToStorage(); rerender(); return; }
  }
  const fid = locVal.startsWith('f:') ? (parseInt(locVal.slice(2)) || null) : null;
  if (_modalIsGroup) {
    const ts = todayStr();
    const date = (viewDate && viewDate !== ts) ? viewDate : null;
    tasks.push({ id: ++uid, text, isHeader: true, done: false, indent: 0, color: null, sched: date ? { date } : null, folderId: fid });
  } else {
    const timeVal = $('#modal-time').value;
    const dateVal = $('#modal-date').value;
    const ts = todayStr();
    let sched = null;
    if (timeVal) { const durMins = (parseInt($('#modal-dur-h').value) || 0) * 60 + (parseInt($('#modal-dur-m').value) || 0); sched = { t: timeVal, m: durMins || 30 }; if (dateVal && dateVal !== ts) sched.date = dateVal; }
    else if (dateVal && dateVal !== ts) { sched = { date: dateVal }; }
    const color = timeVal ? '#9898b4' : null;
    tasks.push({ id: ++uid, text, isHeader: false, done: false, indent: 0, color, sched, folderId: fid });
  }
  closeAddModal();
  saveToStorage();
  rerender();
}

$('#modal-type-task').addEventListener('click', () => _setModalType(false));
$('#modal-type-group').addEventListener('click', () => _setModalType(true));
$('#modal-ok').addEventListener('click', submitAddModal);
$('#modal-cancel').addEventListener('click', closeAddModal);
$('#add-modal').addEventListener('mousedown', e => { if (e.target === $('#add-modal')) closeAddModal(); });
$('#modal-time').addEventListener('input', () => {
  $('#modal-dur-field').style.display = $('#modal-time').value ? '' : 'none';
});
['#modal-text', '#modal-time', '#modal-date', '#modal-dur-h', '#modal-dur-m', '#modal-location-sel'].forEach(sel => {
  $(sel).addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); submitAddModal(); }
    if (e.key === 'Escape') { e.preventDefault(); closeAddModal(); }
  });
});

// ── Tab strip ─────────────────────────────────────────────────────────────────
$$('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
$('#btn-sub-projects').addEventListener('click', () => setProjSubTab('projects'));
$('#btn-sub-folders').addEventListener('click',  () => setProjSubTab('folders'));
$('#btn-new-folder').addEventListener('click', () => {
  folders.push({ id: ++fUid, name: 'New Folder', collapsed: false });
  saveToStorage(); renderFolders();
  setTimeout(() => {
    const names = $$('.folder-name'); const last = names[names.length - 1];
    if (last) { last.focus(); document.execCommand('selectAll', false, null); }
  }, 30);
});
$('#btn-new-project').addEventListener('click', () => {
  projects.push({ id: ++pUid, name: 'New Project', collapsed: false, tasks: [] });
  saveToStorage(); renderProjects();
  setTimeout(() => {
    const names = $$('.project-name'); const last = names[names.length - 1];
    if (last) { last.focus(); document.execCommand('selectAll', false, null); }
  }, 40);
});

// ── Global keyboard shortcuts ──────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.isContentEditable || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  // Date panel keyboard navigation takes priority
  if (datePanelIsOpen() && !e.shiftKey && !e.metaKey && !e.ctrlKey) {
    if (e.key === 'ArrowLeft')  { e.preventDefault(); dpMoveFocus(-1);  return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); dpMoveFocus(1);   return; }
    if (e.key === 'ArrowUp')    { e.preventDefault(); dpMoveFocus(-7);  return; }
    if (e.key === 'ArrowDown')  { e.preventDefault(); dpMoveFocus(7);   return; }
    if (e.key === 'Enter')      { e.preventDefault(); dpSelectFocus();  return; }
  }

  // Zoom presets — 1 whole day · 2 default · 3 detailed · 4 close-up
  if (currentTab === 'schedule' && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
    if (e.key === '1') { e.preventDefault(); applyZoom(Math.max(PPM_MIN, ($('#card-body').clientHeight - 16) / (tlEnd - tlStart))); return; }
    if (e.key === '2') { e.preventDefault(); applyZoom(1.5); return; }
    if (e.key === '3') { e.preventDefault(); applyZoom(3);   return; }
    if (e.key === '4') { e.preventDefault(); applyZoom(5);   return; }
  }

  if ((e.key === 'w' || e.key === 'W') && !e.metaKey && !e.ctrlKey && currentTab === 'schedule') {
    e.preventDefault(); setViewMode(viewMode === 'week' ? 'day' : 'week'); return;
  }
  if ((e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey && currentTab === 'schedule') {
    e.preventDefault(); openAddModal();
  }
  if ((e.key === 'd' || e.key === 'D') && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    const now = Date.now();
    if (now - _lastDKey < 400) { closeDatePanel(); viewDate = null; rerender(); _lastDKey = 0; }
    else { _lastDKey = now; openDateModal(); }
  }
  if (e.key === 'ArrowLeft' && e.shiftKey && (e.metaKey || e.ctrlKey)) {
    e.preventDefault(); goPrevDay();
  }
  if (e.key === 'ArrowRight' && e.shiftKey && (e.metaKey || e.ctrlKey)) {
    e.preventDefault(); goNextDay();
  }
  if (e.key === 'Escape') { closeAddModal(); closeNotesModal(false); closeRepeatModal(); closeSchedModal(); closeTaskMenu(); closeDatePanel(); closeSettings(); if (folderDrawerOpen) toggleFolderDrawer(false); }
  if ((e.metaKey || e.ctrlKey) && e.key === '1') { e.preventDefault(); switchTab('schedule'); }
  if ((e.metaKey || e.ctrlKey) && e.key === '2') { e.preventDefault(); switchTab('projects'); }
  if ((e.metaKey || e.ctrlKey) && e.key === '3') { e.preventDefault(); switchTab('horizons'); }
  if ((e.metaKey || e.ctrlKey) && e.key === '4') { e.preventDefault(); switchTab('repeaters'); }
  if (e.key === 'e' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); doExport(); }
  if (e.key === 'i' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('#import-file-input').click(); }
});

// ── Settings & dark mode ──────────────────────────────────────────────────────
const PREFS_KEY = 'habit-watcher-prefs';
let darkMode = false;
let showFutureRepeaters = true;

function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ darkMode, showFutureRepeaters })); } catch(e) {}
}
function setDarkMode(on) {
  darkMode = on;
  document.body.classList.toggle('dark', on);
  $('#toggle-dark').checked = on;
  savePrefs();
}
function setShowFutureRepeaters(on) {
  showFutureRepeaters = on;
  $('#toggle-future-rep').checked = on;
  savePrefs();
  rerender();
}
(function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
    if (p.darkMode) setDarkMode(true);
    if (p.showFutureRepeaters === false) setShowFutureRepeaters(false);
  } catch(e) {}
})();
$('#toggle-dark').addEventListener('change', e => setDarkMode(e.target.checked));
$('#toggle-future-rep').addEventListener('change', e => setShowFutureRepeaters(e.target.checked));

let _settingsOpen = false;
function openSettings() {
  _settingsOpen = true;
  const btn = $('#btn-settings');
  const panel = $('#settings-panel');
  btn.classList.add('active');
  const r = btn.getBoundingClientRect();
  panel.style.top  = (r.bottom + 6) + 'px';
  panel.style.left = Math.max(4, r.right - 180) + 'px';
  panel.classList.add('open');
}
function closeSettings() {
  _settingsOpen = false;
  $('#btn-settings').classList.remove('active');
  $('#settings-panel').classList.remove('open');
}
$('#btn-settings').addEventListener('click', e => {
  e.stopPropagation();
  _settingsOpen ? closeSettings() : openSettings();
});
document.addEventListener('click', e => {
  if (_settingsOpen && !$('#settings-panel').contains(e.target)) closeSettings();
});

async function startApp() {
  await loadFromSupabase();
  $('#auth-screen').style.display = 'none';
  $('#toggle-hide-done').checked = hideCompleted;
  if (horizons.length === 0) horizons = initDefaultHorizons();
  populateTimeSelects();
  buildDatePanel();
  rerender();
  requestAnimationFrame(() => {
    const h = $('#card-body').clientHeight - 16;
    applyZoom(Math.max(PPM_MIN, h / (tlEnd - tlStart)));
  });
}

$('#auth-submit').addEventListener('click', async () => {
  const email = $('#auth-email').value.trim();
  const password = $('#auth-password').value;
  $('#auth-error').textContent = '';
  $('#auth-submit').disabled = true;
  $('#auth-submit').textContent = 'Signing in…';
  const { error } = await _sb.auth.signInWithPassword({ email, password });
  $('#auth-submit').disabled = false;
  $('#auth-submit').textContent = 'Sign in';
  if (error) { $('#auth-error').textContent = error.message; return; }
  await startApp();
});

$('#auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') $('#auth-submit').click(); });

$('#btn-signout').addEventListener('click', async () => {
  await _sb.auth.signOut();
  location.reload();
});

(async () => {
  const { data: { session } } = await _sb.auth.getSession();
  if (session) { await startApp(); }
  // else: auth screen stays visible, user must sign in
})();

// ── Service worker registration ───────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
